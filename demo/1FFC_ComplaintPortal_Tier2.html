<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>1FFC Complaint Management Portal — v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root {
  --navy:#0F2044; --navy-light:#1e3a6e; --navy-dim:rgba(15,32,68,0.07);
  --blue-tint:#E8F0FE; --blue-mid:#BFDBFE;
  --amber:#F59E0B; --amber-bg:#FEF3C7; --amber-dark:#92400E;
  --emerald:#10B981; --emerald-bg:#D1FAE5; --emerald-dark:#065F46;
  --red:#EF4444; --red-bg:#FEE2E2; --red-dark:#991B1B;
  --purple:#8B5CF6; --purple-bg:#EDE9FE; --purple-dark:#5B21B6;
  --sky:#3B82F6; --sky-bg:#DBEAFE;
  --gray-50:#F9FAFB; --gray-100:#F3F4F6; --gray-200:#E5E7EB;
  --gray-300:#D1D5DB; --gray-400:#9CA3AF; --gray-500:#6B7280;
  --gray-600:#4B5563; --gray-700:#374151; --gray-900:#111827;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--gray-50);color:var(--gray-900);font-size:14px}
.app-shell{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:232px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo-top{display:flex;align-items:center;gap:8px}
.logo-badge{background:var(--amber);color:var(--gray-900);font-size:11px;font-weight:800;padding:3px 7px;border-radius:5px;letter-spacing:0.03em}
.logo-name{font-size:14px;font-weight:800;color:white;letter-spacing:0.04em}
.logo-sub{font-size:10px;color:rgba(255,255,255,0.4);margin-top:4px;letter-spacing:0.04em;text-transform:uppercase}
.sidebar-nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-section{font-size:9.5px;font-weight:700;color:rgba(255,255,255,0.35);letter-spacing:0.1em;text-transform:uppercase;padding:10px 10px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;color:rgba(255,255,255,0.6);border:none;background:none;width:100%;text-align:left;transition:all .15s;position:relative}
.nav-item:hover{background:rgba(255,255,255,0.08);color:white}
.nav-item.active{background:rgba(255,255,255,0.14);color:white;font-weight:600}
.nav-item.locked{opacity:.3;cursor:not-allowed;pointer-events:none}
.nav-icon{font-size:14px;flex-shrink:0;width:18px;text-align:center}
.nav-badge{margin-left:auto;padding:2px 6px;border-radius:10px;font-size:10px;font-weight:700}
.nav-badge.red{background:var(--red);color:white}
.nav-badge.amber{background:var(--amber);color:var(--gray-900)}
.nav-badge.gray{background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.8)}
.sidebar-footer{padding:12px 12px;border-top:1px solid rgba(255,255,255,0.08)}
.user-pill{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.15);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-name{font-size:12px;font-weight:600;color:white}
.user-role-lbl{font-size:10px;color:rgba(255,255,255,0.45);margin-top:1px}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:52px;background:white;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;z-index:10}
.topbar-title{font-size:15px;font-weight:700;color:var(--gray-900);flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:20px 24px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:'Inter',sans-serif;white-space:nowrap}
.btn-primary{background:var(--navy);color:white}
.btn-primary:hover{background:var(--navy-light)}
.btn-secondary{background:var(--gray-100);color:var(--gray-700);border:1px solid var(--gray-200)}
.btn-secondary:hover{background:var(--gray-200)}
.btn-emerald{background:var(--emerald);color:white}
.btn-emerald:hover{background:#059669}
.btn-amber{background:var(--amber);color:white}
.btn-danger{background:var(--red);color:white}
.btn-sm{padding:5px 11px;font-size:11.5px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* CARDS */
.card{background:white;border-radius:10px;border:1px solid var(--gray-200)}
.card-pad{padding:18px 20px}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi-card{background:white;border:1px solid var(--gray-200);border-radius:10px;padding:16px 18px}
.kpi-card.accent-amber{border-left:4px solid var(--amber)}
.kpi-card.accent-red{border-left:4px solid var(--red)}
.kpi-card.accent-emerald{border-left:4px solid var(--emerald)}
.kpi-card.accent-navy{border-left:4px solid var(--navy)}
.kpi-label{font-size:10.5px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em}
.kpi-value{font-size:26px;font-weight:800;color:var(--gray-900);margin:4px 0 2px;line-height:1}
.kpi-sub{font-size:11px;color:var(--gray-500)}
.kpi-trend{font-size:11px;font-weight:600}
.kpi-trend.up{color:var(--red)}
.kpi-trend.down{color:var(--emerald)}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-open{background:var(--sky-bg);color:#1D4ED8}
.badge-review{background:var(--amber-bg);color:var(--amber-dark)}
.badge-resolved{background:var(--emerald-bg);color:var(--emerald-dark)}
.badge-closed{background:var(--gray-100);color:var(--gray-600)}
.badge-escalated{background:var(--red-bg);color:var(--red-dark)}
.badge-critical{background:var(--red-bg);color:var(--red-dark)}
.badge-high{background:var(--amber-bg);color:var(--amber-dark)}
.badge-medium{background:var(--sky-bg);color:#1D4ED8}
.badge-low{background:var(--gray-100);color:var(--gray-600)}
.badge-respa{background:var(--purple-bg);color:var(--purple-dark)}
.badge-fcra{background:#FCE7F3;color:#9D174D}
.badge-udaap{background:var(--amber-bg);color:var(--amber-dark)}
.badge-ecoa{background:var(--emerald-bg);color:var(--emerald-dark)}
.badge-fdcpa{background:var(--sky-bg);color:#1D4ED8}
.badge-none{background:var(--gray-100);color:var(--gray-500)}

/* TABLE */
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;font-size:10.5px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.05em;padding:9px 14px;border-bottom:1px solid var(--gray-200);background:var(--gray-50);white-space:nowrap}
.data-table td{padding:11px 14px;border-bottom:1px solid var(--gray-100);font-size:12.5px;color:var(--gray-700);vertical-align:middle}
.data-table tr:hover td{background:var(--blue-tint);cursor:pointer}
.data-table tr.no-hover:hover td{background:none;cursor:default}
.case-id{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500;color:var(--navy)}
.ts-mono{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gray-500)}

/* SLA */
.sla-wrap{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500}
.sla-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sla-ok{color:var(--emerald)}.sla-ok .sla-dot{background:var(--emerald)}
.sla-warn{color:var(--amber)}.sla-warn .sla-dot{background:var(--amber);animation:pulse 1s infinite}
.sla-breach{color:var(--red)}.sla-breach .sla-dot{background:var(--red);animation:pulse .7s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}

/* DRAWER */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;justify-content:flex-end}
.drawer{width:500px;background:white;height:100%;overflow-y:auto;box-shadow:-6px 0 32px rgba(0,0,0,.18);display:flex;flex-direction:column}
.drawer-hdr{padding:18px 20px;display:flex;align-items:flex-start;gap:12px;background:var(--navy);flex-shrink:0}
.drawer-hdr-info{flex:1;min-width:0}
.drawer-hdr-id{font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(255,255,255,.6);margin-bottom:3px}
.drawer-hdr-name{font-size:16px;font-weight:700;color:white;margin-bottom:2px}
.drawer-hdr-sub{font-size:12px;color:rgba(255,255,255,.55)}
.drawer-close{background:rgba(255,255,255,.12);border:none;color:white;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.drawer-body{padding:18px 20px;flex:1}
.drawer-section{margin-bottom:18px}
.drawer-section-title{font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-item label{font-size:10.5px;font-weight:600;color:var(--gray-500);display:block;margin-bottom:2px}
.detail-item span{font-size:13px;color:var(--gray-900)}
.narrative-box{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:12px;font-size:12.5px;color:var(--gray-700);line-height:1.6}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--gray-200)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{position:absolute;left:-19px;top:3px;width:10px;height:10px;border-radius:50%;background:white;border:2px solid var(--gray-300)}
.tl-dot.create{border-color:var(--navy);background:var(--navy)}
.tl-dot.classify{border-color:var(--purple);background:var(--purple)}
.tl-dot.status{border-color:var(--amber);background:var(--amber)}
.tl-dot.assign{border-color:var(--emerald);background:var(--emerald)}
.tl-dot.note{border-color:var(--gray-400);background:var(--gray-400)}
.tl-dot.export{border-color:var(--sky);background:var(--sky)}
.tl-ts{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--gray-400);margin-bottom:2px}
.tl-action{font-size:12.5px;color:var(--gray-700);line-height:1.4}
.tl-actor{font-size:11px;font-weight:600;color:var(--gray-500);margin-top:2px}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label{font-size:11.5px;font-weight:600;color:var(--gray-600)}
input,select,textarea{padding:9px 11px;border:1.5px solid var(--gray-200);border-radius:7px;font-size:13px;font-family:'Inter',sans-serif;color:var(--gray-900);background:white;transition:border-color .15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-dim)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
.char-count{font-size:10.5px;color:var(--gray-400);text-align:right}
.field-error{font-size:11px;color:var(--red);margin-top:2px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:white;border-radius:14px;padding:24px;width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.22)}
.modal-title{font-size:17px;font-weight:800;color:var(--gray-900);margin-bottom:4px}
.modal-sub{font-size:12.5px;color:var(--gray-500);margin-bottom:20px}
.role-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.role-card{border:2px solid var(--gray-200);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;text-align:left;background:white}
.role-card:hover{border-color:var(--navy);background:var(--blue-tint)}
.role-card.selected{border-color:var(--navy);background:var(--blue-tint)}
.role-card-icon{font-size:22px;margin-bottom:8px}
.role-card-title{font-size:12.5px;font-weight:700;color:var(--gray-900);margin-bottom:3px}
.role-card-desc{font-size:11px;color:var(--gray-500);margin-bottom:10px;line-height:1.4}
.perm-item{display:flex;align-items:center;gap:5px;font-size:10.5px;margin-bottom:3px}
.perm-ok{color:var(--emerald);font-weight:700}
.perm-no{color:var(--gray-300);font-weight:700}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:white;padding:11px 16px;border-radius:9px;font-size:12.5px;font-weight:500;z-index:999;box-shadow:0 6px 24px rgba(0,0,0,.2);animation:slideUp .2s ease;display:flex;align-items:center;gap:8px;max-width:380px}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ROLE PILL */
.role-pill{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;cursor:pointer;border:1.5px solid;transition:all .15s}
.role-pill:hover{opacity:.85}

/* AI CLASSIFIER */
.classifier-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.example-btn{display:block;width:100%;text-align:left;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:7px;cursor:pointer;font-size:12px;color:var(--gray-600);background:white;transition:all .15s;margin-bottom:6px;font-family:'Inter',sans-serif}
.example-btn:hover{border-color:var(--navy);color:var(--navy);background:var(--blue-tint)}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--gray-100)}
.result-row:last-child{border:none}
.result-label{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em}
.result-value{font-size:13px;font-weight:600;color:var(--gray-900);text-align:right}
.confidence-bar{height:6px;border-radius:3px;overflow:hidden;background:var(--gray-100);margin-top:3px}
.confidence-fill{height:100%;border-radius:3px;transition:width .8s ease}
.signal-chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--blue-tint);color:var(--navy);margin:2px}

/* CFPB REPORT */
.report-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:14px 16px;background:var(--gray-50);border-radius:9px;margin-bottom:18px;border:1px solid var(--gray-200)}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-group label{font-size:10.5px;font-weight:600;color:var(--gray-500)}
.filter-group select{padding:6px 10px;font-size:12px;min-width:140px}
.report-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.rs-card{background:white;border:1px solid var(--gray-200);border-radius:8px;padding:12px 14px;text-align:center}
.rs-val{font-size:20px;font-weight:800;color:var(--gray-900)}
.rs-lbl{font-size:10px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}

/* AUDIT LOG */
.audit-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.audit-filters input{padding:7px 11px;border:1.5px solid var(--gray-200);border-radius:7px;font-size:12px;min-width:200px}
.audit-filters select{padding:7px 11px;border:1.5px solid var(--gray-200);border-radius:7px;font-size:12px}
.audit-tl{position:relative;padding-left:28px;max-width:900px}
.audit-tl::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--gray-200)}
.audit-item{position:relative;margin-bottom:14px;display:flex;gap:14px}
.audit-dot{position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:white;border:2px solid var(--gray-300);flex-shrink:0}
.audit-dot.create{border-color:var(--navy);background:var(--navy)}
.audit-dot.classify{border-color:var(--purple);background:var(--purple)}
.audit-dot.status{border-color:var(--amber);background:var(--amber)}
.audit-dot.assign{border-color:var(--emerald);background:var(--emerald)}
.audit-dot.note{border-color:var(--gray-400);background:var(--gray-400)}
.audit-dot.export{border-color:var(--sky);background:var(--sky)}
.audit-body{flex:1;min-width:0;background:white;border:1px solid var(--gray-200);border-radius:8px;padding:10px 14px}
.audit-ts{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--gray-400)}
.audit-action{font-size:12.5px;color:var(--gray-700);margin:2px 0}
.audit-meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.audit-case-chip{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;color:var(--navy);background:var(--blue-tint);padding:2px 7px;border-radius:5px;cursor:pointer}
.audit-actor-chip{font-size:10.5px;font-weight:600;color:var(--gray-600);background:var(--gray-100);padding:2px 7px;border-radius:5px}

/* ANALYTICS */
.analytics-row{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.analytics-row.thirds{grid-template-columns:1fr 1fr 1fr}
.chart-title{font-size:13px;font-weight:700;color:var(--gray-900);margin-bottom:14px}
.chart-sub{font-size:11px;color:var(--gray-500);margin-top:2px}
.v-bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:0 4px}
.v-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.v-bar-val{font-size:10.5px;font-weight:700;color:var(--gray-600)}
.v-bar-fill{width:100%;border-radius:4px 4px 0 0;transition:height .6s ease;min-height:4px}
.v-bar-lbl{font-size:10px;color:var(--gray-500);text-align:center;line-height:1.2}
.h-bars{display:flex;flex-direction:column;gap:8px}
.h-bar-row{display:flex;align-items:center;gap:8px}
.h-bar-lbl{width:130px;font-size:11.5px;color:var(--gray-600);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-bar-track{flex:1;height:22px;background:var(--gray-100);border-radius:4px;overflow:hidden}
.h-bar-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;transition:width .6s ease}
.h-bar-fill span{font-size:11px;font-weight:700;color:white}
.h-bar-count{width:28px;font-size:11.5px;font-weight:600;color:var(--gray-700);text-align:right;flex-shrink:0}
.donut-wrap{display:flex;gap:16px;align-items:center}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:6px}
.legend-row{display:flex;align-items:center;gap:7px;font-size:11.5px}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend-label{flex:1;color:var(--gray-700)}
.legend-val{font-weight:700;color:var(--gray-900)}
.legend-pct{color:var(--gray-400);font-size:10.5px}
.sla-gauge{display:flex;flex-direction:column;align-items:center;padding:8px 0}
.gauge-ring{position:relative;width:100px;height:100px;margin-bottom:10px}
.gauge-number{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-pct{font-size:22px;font-weight:800;color:var(--gray-900)}
.gauge-lbl{font-size:10px;color:var(--gray-500)}

/* MISC */
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:14.5px;font-weight:700;color:var(--gray-900)}
.empty-state{text-align:center;padding:48px 24px;color:var(--gray-500)}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-title{font-size:14px;font-weight:600;color:var(--gray-700);margin-bottom:4px}
.empty-desc{font-size:12.5px}
.pill-tabs{display:flex;gap:4px;background:var(--gray-100);padding:3px;border-radius:8px}

const fmtDate = (iso) => new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const fmtDT   = (iso) => new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true});
const fmtTS   = (iso) => {
  const d = new Date(iso);
  return d.toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).replace(',','');
};

function getSLA(c) {
  const dl = new Date(c.slaDeadline).getTime();
  const diff = dl - Date.now();
  if (diff < 0) return { status:'breach', label:'BREACHED', cls:'sla-breach' };
  const hrs = diff / 3600000;
  if (hrs < 4) return { status:'warn', label:`${Math.ceil(hrs)}h left`, cls:'sla-warn' };
  if (hrs < 24) return { status:'warn', label:`${Math.ceil(hrs)}h left`, cls:'sla-warn' };
  const days = Math.floor(hrs / 24);
  const remH = Math.ceil(hrs % 24);
  return { status:'ok', label: days > 0 ? `${days}d ${remH}h` : `${Math.ceil(hrs)}h`, cls:'sla-ok' };
}

let _slaTimer = null;
function useTick() {
  const [t, setT] = useState(0);
  useEffect(() => { const id = setInterval(()=>setT(x=>x+1),1000); return ()=>clearInterval(id); },[]);
  return t;
}

function exportCSV(rows, filename) {
  if (!rows.length) return;
  const headers = Object.keys(rows[0]);
  const csv = [headers.join(','), ...rows.map(r => headers.map(h => `"${String(r[h]||'').replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

function newId(complaints) {
  const nums = complaints.map(c => parseInt(c.id.split('-')[2]||0,10));
  return `CMP-2024-${String(Math.max(...nums)+1).padStart(4,'0')}`;
}

function StatusBadge({status}) {
  const map = {Open:'badge-open','In Review':'badge-review',Resolved:'badge-resolved',Closed:'badge-closed',Escalated:'badge-escalated'};
  const icons = {Open:'○','In Review':'◑',Resolved:'●',Closed:'✕',Escalated:'⚠'};
  return <span className={`badge ${map[status]||'badge-closed'}`}>{icons[status]} {status}</span>;
}
function PriorityBadge({p}) {
  const map = {Critical:'badge-critical',High:'badge-high',Medium:'badge-medium',Low:'badge-low'};
  const icons = {Critical:'🔴',High:'🟠',Medium:'🔵',Low:'⚪'};
  return <span className={`badge ${map[p]||'badge-low'}`}>{icons[p]} {p}</span>;
}
function RegBadge({flag}) {
  if (!flag) return <span className="badge badge-none">—</span>;
  const map = {RESPA:'badge-respa',FCRA:'badge-fcra',UDAAP:'badge-udaap',ECOA:'badge-ecoa',FDCPA:'badge-fdcpa'};
  return <span className={`badge ${map[flag]||'badge-none'}`}>{flag}</span>;
}

function SLATimer({complaint}) {
  useTick();
  const sla = getSLA(complaint);
  return (
    <span className={`sla-wrap ${sla.cls}`}>
      <span className="sla-dot"/>
      {sla.label}
    </span>
  );
}

function Toast({message, onDone}) {
  useEffect(() => { if(message){ const t=setTimeout(onDone,3200); return ()=>clearTimeout(t); } },[message]);
  if(!message) return null;
  return <div className="toast">🔔 {message}</div>;
}

      caseId:complaint.id, ts:new Date().toISOString(),
      actor:'Ellen Hart', actorRole:'Director',
      action:`Status: ${complaint.status} → ${status}`, type:'status'
    });
    if (note.trim()) newEvts.push({
      id:`${complaint.id}-e${complaint.auditTrail.length+2}`,
      caseId:complaint.id, ts:new Date().toISOString(),
      actor:'Ellen Hart', actorRole:'Director',
      action:`Note: ${note.trim()}`, type:'note'
    });
    if (assignee !== complaint.assignedTo) newEvts.push({
      id:`${complaint.id}-e${complaint.auditTrail.length+3}`,
      caseId:complaint.id, ts:new Date().toISOString(),
      actor:'Ellen Hart', actorRole:'Director',
      action:`Reassigned to ${assignee||'Unassigned'}`, type:'assign'
    });

function IntakeScreen({complaints, onSubmit}) {
  const [form, setForm] = useState({
    customerName:'',accountLast4:'',channel:'Phone',branch:'',state:'',
    category:'',issue:'',priority:'Medium',narrative:'',
  });
  const [errors, setErrors] = useState({});
  const [success, setSuccess] = useState(null);

  const set = (k,v) => setForm(f=>({...f,[k]:v, ...(k==='category'?{issue:''}:{})}));

  const issues = form.category ? (CFPB_CATEGORIES[form.category]||[]) : [];

  const validate = () => {
    const e = {};
    if (!form.customerName.trim()) e.customerName='Required';
    if (!form.accountLast4.match(/^\d{4}$/)) e.accountLast4='Must be 4 digits';
    if (!form.branch) e.branch='Required';
    if (!form.category) e.category='Required';
    if (!form.issue) e.issue='Required';
    if (form.narrative.length < 20) e.narrative='Please provide at least 20 characters';
    return e;
  };

  const handleSubmit = () => {
    const e = validate();
    setErrors(e);
    if (Object.keys(e).length) return;
    const id = newId(complaints);
    const now2 = new Date().toISOString();
    const slaHours = {Critical:24,High:48,Medium:120,Low:240}[form.priority]||120;
    const newCase = {
      id, submittedAt:now2,
      customerName:form.customerName, accountLast4:form.accountLast4,
      branch:form.branch, state:form.state||form.branch.split(',')[1]?.trim()||'TX',
      channel:form.channel, category:form.category, issue:form.issue,
      priority:form.priority, status:'Open',
      slaDeadline:new Date(Date.now()+slaHours*3600000).toISOString(),
      assignedTo:null, regulatoryFlag:null,
      narrative:form.narrative,
      auditTrail:[{
        id:`${id}-e1`, caseId:id, ts:now2,
        actor:'Intake Form', actorRole:'System',
        action:`Case created via ${form.channel} channel`, type:'create'
      }],
    };
    onSubmit(newCase);
    setSuccess(id);
  };

  if (success) return (
    <div className="card card-pad" style={{maxWidth:600,margin:'0 auto',textAlign:'center',padding:40}}>
      <div style={{fontSize:48,marginBottom:12}}>✅</div>
      <div style={{fontSize:20,fontWeight:800,color:'var(--gray-900)',marginBottom:6}}>Complaint Submitted</div>
      <div className="case-id" style={{fontSize:18,marginBottom:10}}>{success}</div>
      <div style={{fontSize:13,color:'var(--gray-600)',marginBottom:24}}>Case has been created and queued for AI classification. The customer will receive an acknowledgment within 1 business day.</div>
      <div style={{display:'flex',gap:10,justifyContent:'center'}}>
        <button className="btn btn-primary" onClick={()=>setSuccess(null)}>Submit Another</button>
      </div>
    </div>
  );

  return (
    <div style={{maxWidth:720}}>
      <div className="card card-pad">
        <div style={{marginBottom:20,paddingBottom:16,borderBottom:'1px solid var(--gray-200)'}}>
          <div style={{fontSize:15,fontWeight:700,color:'var(--gray-900)',marginBottom:3}}>New Complaint Intake</div>
          <div style={{fontSize:12.5,color:'var(--gray-500)'}}>All fields marked with * are required for CFPB compliance tracking.</div>
        </div>

        <div style={{marginBottom:18}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--gray-500)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:10}}>Customer Information</div>
          <div className="form-grid">
            <div className="form-group">
              <label>Customer Name *</label>
              <input value={form.customerName} onChange={e=>set('customerName',e.target.value)} placeholder="Full legal name"/>
              {errors.customerName && <span className="field-error">{errors.customerName}</span>}
            </div>
            <div className="form-group">
              <label>Account Last 4 Digits *</label>
              <input value={form.accountLast4} onChange={e=>set('accountLast4',e.target.value.replace(/\D/,'').slice(0,4))} placeholder="e.g. 4821" maxLength={4}/>
              {errors.accountLast4 && <span className="field-error">{errors.accountLast4}</span>}
            </div>
            <div className="form-group">
              <label>Intake Channel</label>
              <select value={form.channel} onChange={e=>set('channel',e.target.value)}>
                {['Phone','Email','Web Portal','Mobile App','Branch','Mail','Chat'].map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label>Branch *</label>
              <select value={form.branch} onChange={e=>set('branch',e.target.value)}>
                <option value="">— Select Branch —</option>
                {BRANCHES.map(b=><option key={b}>{b}</option>)}
              </select>
              {errors.branch && <span className="field-error">{errors.branch}</span>}
            </div>
          </div>
        </div>

        <div style={{marginBottom:18}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--gray-500)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:10}}>Complaint Classification</div>
          <div className="form-grid">
            <div className="form-group">
              <label>CFPB Product Category *</label>
              <select value={form.category} onChange={e=>set('category',e.target.value)}>
                <option value="">— Select Category —</option>
                {Object.keys(CFPB_CATEGORIES).map(c=><option key={c}>{c}</option>)}

            <div className="form-group">

              <select value={form.priority} onChange={e=>set('priority',e.target.value)}>

        <div style={{display:'flex',gap:10,paddingTop:14,borderTop:'1px solid var(--gray-200)'}}>
          <button className="btn btn-primary" onClick={handleSubmit}>Submit Complaint</button>

        </div>
      </div>
    </div>
  );

// ─── AI CLASSIFIER ───────────────────────────────────────────────────────────────
const EXAMPLES = [
  {label:'Mortgage double-payment', text:'My mortgage payment was debited twice from my checking account on the 15th. The duplicate charge of $2,847 caused an overdraft. I called customer service three times over two weeks and no one has reversed it.'},
  {label:'Credit card fraud dispute', text:'There is an unauthorized charge of $349 from an unfamiliar online retailer on my credit card statement dated January 12. I have never made a purchase from this company. This appears to be fraud.'},
  {label:'FDCPA harassment complaint', text:'A debt collector has been calling me up to 8 times per day, called my employer and disclosed my debt to my HR manager, and threatened legal action at 9pm. I understand these are violations of federal law.'},
];

function classify(text) {
  const t = text.toLowerCase();
  if (t.includes('mortgage') || t.includes('escrow') || t.includes('loan servicer'))
    return {category:'Mortgage',issue:'Payment processing, late fee',confidence:94,sentiment:'Frustrated',priority:'High',flag:'RESPA',flagReason:'RESPA Section 6 requires timely response to qualified written requests and error resolution.',signals:['Mortgage servicing context','Payment processing error mentioned','Potential escrow or billing dispute'],action:'Acknowledge within 5 business days. Investigate payment records. Provide written RESPA-compliant response within 30 days.'};
  if (t.includes('unauthorized') || t.includes('fraud') || t.includes('did not authorize'))
    return {category:'Credit card or prepaid card',issue:'Problem with a purchase shown on your statement',confidence:91,sentiment:'Alarmed',priority:'High',flag:'FCRA',flagReason:'FCRA Section 611 requires investigation of inaccurate or disputed account information.',signals:['Unauthorized transaction disputed','Fraud / identity theft indicators','Customer denies transaction knowledge'],action:'Issue provisional credit within 5 days. Complete investigation within 30 days. Report outcome to CRAs if applicable.'};
  if (t.includes('collector') || t.includes('debt') || t.includes('fdcpa') || t.includes('harassment'))
    return {category:'Debt collection',issue:'Took or threatened to take negative or legal action',confidence:97,sentiment:'Distressed',priority:'Critical',flag:'FDCPA',flagReason:'FDCPA Section 806 prohibits harassment, obscene language, and repeated calls with intent to annoy. Section 805 prohibits third-party contact.',signals:['Multiple calls per day alleged','Third-party employer disclosure','Threatening language — after-hours contact'],action:'Immediately suspend collection activity. Escalate to Compliance Director. File internal investigation. Response required within 15 days per CFPB.'};
  if (t.includes('credit report') || t.includes('late payment') || t.includes('credit score'))
    return {category:'Credit reporting',issue:'Incorrect information on your report',confidence:98,sentiment:'Concerned',priority:'High',flag:'FCRA',flagReason:'FCRA Section 611 requires CRAs to investigate disputes and correct inaccurate information.',signals:['Inaccurate credit report entry disputed','Impact on credit score stated','Possible furnisher error'],action:'Conduct reasonable investigation within 30 days. Correct or delete inaccurate information. Notify consumer of results.'};
  if (t.includes('wire') || t.includes('transfer') || t.includes('not arrive'))
    return {category:'Money transfer, virtual currency, or money service',issue:'Money was not available when promised',confidence:88,sentiment:'Urgent',priority:'Critical',flag:'UDAAP',flagReason:'UDAAP prohibits unfair, deceptive, or abusive acts in consumer financial services.',signals:['Wire transfer delay beyond promised date','Material financial impact stated','Time-sensitive closing or deadline'],action:'Initiate wire trace immediately. Provide status update within 24 hours. Escalate if funds not located within 48 hours.'};
  return {category:'Checking or savings account',issue:'Managing an account',confidence:81,sentiment:'Frustrated',priority:'Medium',flag:null,flagReason:'No specific regulatory flag triggered. Monitor for pattern.',signals:['General account servicing complaint','No acute regulatory trigger detected','Standard resolution path applicable'],action:'Acknowledge within 1 business day. Investigate account records. Respond within 30 days.'};
}

// ─── CFPB REPORT SCREEN (TIER 2) ────────────────────────────────────────────────
function CFPBReportScreen({complaints, role}) {
  const [catFilter, setCatFilter] = useState('All');
  const [stateFilter, setStateFilter] = useState('All');
  const [flagFilter, setFlagFilter] = useState('All');
  const [statusFilter, setStatusFilter] = useState('All');

  const cats = ['All', ...new Set(complaints.map(c=>c.category))];
  const states = ['All', ...STATES];
  const flags = ['All','RESPA','FCRA','UDAAP','ECOA','FDCPA','None'];

  const rows = complaints.filter(c=>{
    if (catFilter!=='All' && c.category!==catFilter) return false;
    if (stateFilter!=='All' && c.state!==stateFilter) return false;
    if (flagFilter==='None' && c.regulatoryFlag) return false;
    if (flagFilter!=='All' && flagFilter!=='None' && c.regulatoryFlag!==flagFilter) return false;
    if (statusFilter!=='All' && c.status!==statusFilter) return false;
    return true;
  });

  const flagged = rows.filter(c=>c.regulatoryFlag).length;
  const timely = rows.filter(c=>c.status==='Resolved' && getSLA(c).status!=='breach').length;
  const open = rows.filter(c=>c.status==='Open'||c.status==='In Review'||c.status==='Escalated').length;

    const data = rows.map(c=>({
      'Case ID':c.id,
      'Date Submitted':fmtDate(c.submittedAt),
      'Customer Account':c.accountLast4,
      'State':c.state,
      'Branch':c.branch,
      'Channel':c.channel,
      'CFPB Product':c.category,
      'CFPB Issue':c.issue,
      'Priority':c.priority,
      'Company Response':c.status,
      'Timely Response':getSLA(c).status!=='breach'?'Yes':'No',
      'Regulatory Flag':c.regulatoryFlag||'',
      'Assigned To':c.assignedTo||'',
      'SLA Deadline':fmtDT(c.slaDeadline),
    }));
    exportCSV(data, `1FFC_CFPB_Report_${new Date().toISOString().split('T')[0]}.csv`);

  if (!ROLES_CFG[role].perms['CFPB Report export']) return (

      <div className="access-icon">🔒</div>
      <div className="access-title">Access Restricted</div>

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:18}}>
        <div>
          <div style={{fontSize:17,fontWeight:800,color:'var(--gray-900)'}}>CFPB Regulatory Report</div>
          <div style={{fontSize:12.5,color:'var(--gray-500)',marginTop:2}}>Generated {new Date().toLocaleString('en-US',{month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})} · 1FFC Compliance Division</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-emerald btn-sm" onClick={handleExport}>⬇ Export CSV ({rows.length} rows)</button>
        </div>
      </div>

      <div className="report-summary">
        <div className="rs-card"><div className="rs-val">{rows.length}</div><div className="rs-lbl">Total Cases</div></div>
        <div className="rs-card"><div className="rs-val" style={{color:'var(--red)'}}>{flagged}</div><div className="rs-lbl">Regulatory Flags</div></div>
        <div className="rs-card"><div className="rs-val" style={{color:'var(--amber)'}}>{open}</div><div className="rs-lbl">Open / Pending</div></div>
        <div className="rs-card"><div className="rs-val" style={{color:'var(--emerald)'}}>{timely}</div><div className="rs-lbl">Timely Response</div></div>
        <div className="rs-card"><div className="rs-val">{rows.length>0?Math.round((rows.filter(c=>c.status==='Resolved').length/rows.length)*100):0}%</div><div className="rs-lbl">Resolution Rate</div></div>
      </div>

      <div className="report-filters">
        <div className="filter-group"><label>Category</label><select value={catFilter} onChange={e=>setCatFilter(e.target.value)}>{cats.map(c=><option key={c}>{c}</option>)}</select></div>
        <div className="filter-group"><label>State</label><select value={stateFilter} onChange={e=>setStateFilter(e.target.value)}>{states.map(s=><option key={s}>{s}</option>)}</select></div>
        <div className="filter-group"><label>Reg. Flag</label><select value={flagFilter} onChange={e=>setFlagFilter(e.target.value)}>{flags.map(f=><option key={f}>{f}</option>)}</select></div>
        <div className="filter-group"><label>Status</label><select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>{['All','Open','In Review','Escalated','Resolved','Closed'].map(s=><option key={s}>{s}</option>)}</select></div>
      </div>

      <div className="card" style={{overflowX:'auto'}}>
        <table className="data-table">
          <thead>
            <tr>
              <th>Case ID</th>
              <th>Date</th>
              <th>State</th>
              <th>CFPB Product</th>
              <th>Issue</th>
              <th>Priority</th>
              <th>Company Response</th>
              <th>Timely?</th>

          </thead>
          <tbody>
            {rows.length===0 && (
              <tr className="no-hover"><td colSpan={10} style={{textAlign:'center',padding:28,color:'var(--gray-500)'}}>No records match current filters.</td></tr>
            )}
            {rows.map(c=>{
              const sla = getSLA(c);
              const timely = c.status==='Resolved' && sla.status!=='breach';
              return (
                <tr key={c.id} className="no-hover">
                  <td><span className="case-id">{c.id}</span></td>
                  <td><span className="ts-mono">{fmtDate(c.submittedAt)}</span></td>
                  <td><span className="badge badge-medium">{c.state}</span></td>
                  <td style={{fontSize:12,maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.category}</td>
                  <td style={{fontSize:12,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'var(--gray-600)'}}>{c.issue}</td>
                  <td><PriorityBadge p={c.priority}/></td>
                  <td><StatusBadge status={c.status}/></td>
                  <td>
                    {c.status==='Resolved'
                      ? <span className={`badge ${timely?'badge-resolved':'badge-escalated'}`}>{timely?'✓ Yes':'✕ No'}</span>
                      : <span className="badge badge-review">Pending</span>}
                  </td>
                  <td><RegBadge flag={c.regulatoryFlag}/></td>
                  <td style={{fontSize:12,color:'var(--gray-600)'}}>{c.assignedTo||'—'}</td>

        </table>

      <div style={{marginTop:14,padding:'11px 16px',background:'var(--blue-tint)',borderRadius:9,border:'1px solid var(--blue-mid)',fontSize:12,color:'var(--navy)',lineHeight:1.6}}>
        ℹ️ <strong>Compliance Notice:</strong> This report is for internal use only. CFPB complaint data submitted externally through the CFPB Consumer Response portal must follow the HMDA/CFPB-approved submission format. Regulatory flags are indicative — final determination requires attorney review. Export contains {rows.length} record{rows.length!==1?'s':''}.
      </div>
    </div>
  );
}

// ─── AUDIT LOG SCREEN (TIER 2) ───────────────────────────────────────────────────
function AuditLogScreen({complaints, role, onSelectCase}) {
  const [search, setSearch] = useState('');
  const [typeFilter, setTypeFilter] = useState('All');
  const [caseFilter, setCaseFilter] = useState('');

  if (!ROLES_CFG[role].perms['Audit log access']) return (
    <div className="access-denied">
      <div className="access-icon">🔒</div>
      <div className="access-title">Access Restricted</div>
      <div className="access-desc">The Audit Log requires Compliance Officer or Administrator role.</div>
    </div>
  );

  const allEvents = complaints
    .flatMap(c => c.auditTrail)
    .sort((a,b) => new Date(b.ts) - new Date(a.ts));

  const typeLabels = {All:'All Events',create:'Case Created',classify:'AI Classification',status:'Status Change',assign:'Assignment',note:'Notes / Comments',export:'Exports'};

  const filtered = allEvents.filter(e=>{
    if (typeFilter!=='All' && e.type!==typeFilter) return false;
    if (caseFilter && !e.caseId.toLowerCase().includes(caseFilter.toLowerCase())) return false;
    if (search) {
      const q = search.toLowerCase();
      return e.action.toLowerCase().includes(q) || e.actor.toLowerCase().includes(q) || e.caseId.toLowerCase().includes(q);
    }
    return true;
  });

  const typeColor = {create:'var(--navy)',classify:'var(--purple)',status:'var(--amber)',assign:'var(--emerald)',note:'var(--gray-400)',export:'var(--sky)'};

  return (
    <div>
      <div style={{marginBottom:18}}>
        <div style={{fontSize:17,fontWeight:800,color:'var(--gray-900)',marginBottom:2}}>Immutable Audit Log</div>
        <div style={{fontSize:12.5,color:'var(--gray-500)'}}>Complete tamper-evident activity trail across all cases · {allEvents.length} total events</div>
      </div>

      <div className="audit-filters">
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search actions, actors, case IDs…" style={{outline:'none'}}/>
        <select value={typeFilter} onChange={e=>setTypeFilter(e.target.value)} style={{outline:'none'}}>
          {Object.entries(typeLabels).map(([k,v])=><option key={k} value={k}>{v}</option>)}
        </select>
        <input value={caseFilter} onChange={e=>setCaseFilter(e.target.value)} placeholder="Filter by Case ID…" style={{outline:'none',minWidth:160}}/>
        <span style={{fontSize:12,color:'var(--gray-500)',marginLeft:'auto'}}>{filtered.length} of {allEvents.length} events</span>
      </div>

      <div className="audit-tl">
        {filtered.length===0 && (
          <div style={{textAlign:'center',padding:40,color:'var(--gray-500)'}}>No events match your filters.</div>
        )}
        {filtered.map(e=>(
          <div key={e.id} className="audit-item">
            <div className={`audit-dot ${e.type}`}/>
            <div className="audit-body">
              <div className="audit-ts">{fmtTS(e.ts)}</div>
              <div className="audit-action">{e.action}</div>
              <div className="audit-meta">
                <span className="audit-case-chip" onClick={()=>onSelectCase&&onSelectCase(e.caseId)}>{e.caseId}</span>
                <span className="audit-actor-chip">{e.actor}</span>
                <span className="audit-actor-chip" style={{background:typeColor[e.type],color:'white'}}>{typeLabels[e.type]||e.type}</span>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── ANALYTICS SCREEN (TIER 2) ──────────────────────────────────────────────────
const MONTHLY = [
  {month:'Aug',count:31},{month:'Sep',count:38},{month:'Oct',count:44},
  {month:'Nov',count:29},{month:'Dec',count:52},{month:'Jan',count:SEED.length,current:true},
];

function AnalyticsScreen({complaints, role}) {
  if (!ROLES_CFG[role].perms['Analytics dashboard']) return (
    <div className="access-denied">
      <div className="access-icon">🔒</div>
      <div className="access-title">Access Restricted</div>
      <div className="access-desc">Analytics Dashboard requires Compliance Officer or Administrator role.</div>
    </div>
  );

  const catCounts = Object.entries(
    complaints.reduce((acc,c)=>{acc[c.category]=(acc[c.category]||0)+1; return acc;},{})
  ).sort((a,b)=>b[1]-a[1]);

  const branchCounts = Object.entries(
    complaints.reduce((acc,c)=>{
      const name = c.branch.split('—')[1]?.trim().split(',')[0]||c.branch;
      acc[name]=(acc[name]||0)+1; return acc;
    },{})
  ).sort((a,b)=>b[1]-a[1]).slice(0,6);

  const flagCounts = ['RESPA','FCRA','UDAAP','ECOA','FDCPA'].map(f=>({
    flag:f, count:complaints.filter(c=>c.regulatoryFlag===f).length
  })).filter(x=>x.count>0);

  const total = complaints.length;
  const resolved = complaints.filter(c=>c.status==='Resolved').length;
  const breachedAll = complaints.filter(c=>getSLA(c).status==='breach' && c.status!=='Resolved').length;
  const flaggedAll = complaints.filter(c=>c.regulatoryFlag).length;
  const slaComp = total > 0 ? Math.round(((total-breachedAll)/total)*100) : 100;

  const maxMonth = Math.max(...MONTHLY.map(d=>d.count));
  const maxBranch = Math.max(...branchCounts.map(b=>b[1]));
  const maxCat = catCounts.length > 0 ? catCounts[0][1] : 1;

  const CAT_COLORS = ['#0F2044','#1e3a6e','#3B82F6','#8B5CF6','#10B981','#F59E0B','#EF4444','#6B7280','#14B8A6'];

  // SVG donut for SLA
  const r = 40; const cx = 50; const cy = 50;
  const circ = 2 * Math.PI * r;
  const filled = circ * (slaComp / 100);
  const donutColor = slaComp >= 90 ? 'var(--emerald)' : slaComp >= 75 ? 'var(--amber)' : 'var(--red)';

  return (
    <div>
      <div style={{marginBottom:18}}>
        <div style={{fontSize:17,fontWeight:800,color:'var(--gray-900)',marginBottom:2}}>Analytics Dashboard</div>
        <div style={{fontSize:12.5,color:'var(--gray-500)'}}>Live metrics across all branches · Updated every session</div>
      </div>

      <div className="kpi-grid">
        <div className="kpi-card accent-navy">
          <div className="kpi-label">Total Complaints</div>
          <div className="kpi-value">{total}</div>
          <div className="kpi-sub" style={{display:'flex',alignItems:'center',gap:4}}>
            <span className="kpi-trend up">↑ 14%</span> vs last month
          </div>
        </div>
        <div className="kpi-card accent-emerald">
          <div className="kpi-label">Resolution Rate</div>
          <div className="kpi-value" style={{color:'var(--emerald)'}}>{total>0?Math.round((resolved/total)*100):0}%</div>
          <div className="kpi-sub">{resolved} of {total} resolved</div>
        </div>
        <div className="kpi-card accent-amber">
          <div className="kpi-label">SLA Compliance</div>
          <div className="kpi-value" style={{color:slaComp>=90?'var(--emerald)':slaComp>=75?'var(--amber)':'var(--red)'}}>{slaComp}%</div>
          <div className="kpi-sub">{breachedAll} breach{breachedAll!==1?'es':''} active</div>
        </div>
        <div className="kpi-card accent-red">
          <div className="kpi-label">Regulatory Flags</div>
          <div className="kpi-value" style={{color:'var(--red)'}}>{flaggedAll}</div>
          <div className="kpi-sub">{total>0?Math.round((flaggedAll/total)*100):0}% of cases flagged</div>
        </div>
      </div>

      <div className="analytics-row">
        <div className="card card-pad">
          <div className="chart-title">Complaint Volume — Last 6 Months</div>
          <div className="v-bars">
            {MONTHLY.map((d,i)=>(
              <div key={i} className="v-bar-col">
                <div className="v-bar-val">{d.count}</div>
                <div className="v-bar-fill" style={{
                  height:`${Math.round((d.count/maxMonth)*100)}px`,
                  background: d.current ? 'var(--navy)' : 'var(--blue-tint)',
                  border: d.current ? 'none' : '1px solid var(--blue-mid)',
                }}/>
                <div className="v-bar-lbl">{d.month}{d.current?<><br/><span style={{color:'var(--navy)',fontWeight:700}}>●</span></>:''}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="card card-pad">
          <div className="chart-title">SLA Compliance Rate</div>
          <div className="sla-gauge">
            <div className="gauge-ring">
              <svg viewBox="0 0 100 100" style={{width:100,height:100,transform:'rotate(-90deg)'}}>
                <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--gray-200)" strokeWidth="10"/>
                <circle cx={cx} cy={cy} r={r} fill="none" stroke={donutColor} strokeWidth="10"
                  strokeDasharray={`${filled} ${circ-filled}`} strokeLinecap="round"
                  style={{transition:'stroke-dasharray .8s ease'}}/>
              </svg>
              <div className="gauge-number">
                <div className="gauge-pct" style={{color:donutColor}}>{slaComp}%</div>
                <div className="gauge-lbl">On-time</div>
              </div>
            </div>
            <div style={{width:'100%'}}>
              {[
                {label:'✓ On-time', count:total-breachedAll, color:'var(--emerald)'},
                {label:'✕ Breached', count:breachedAll, color:'var(--red)'},
              ].map((item,i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 0',borderBottom:i===0?'1px solid var(--gray-100)':'none'}}>
                  <span style={{fontSize:12,color:item.color,fontWeight:600}}>{item.label}</span>
                  <span style={{fontSize:13,fontWeight:700,color:'var(--gray-900)'}}>{item.count}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      <div className="analytics-row" style={{marginBottom:16}}>
        <div className="card card-pad">
          <div className="chart-title">Cases by CFPB Product Category</div>
          <div className="h-bars">
            {catCounts.slice(0,7).map(([cat,cnt],i)=>(
              <div key={i} className="h-bar-row">
                <div className="h-bar-lbl" title={cat}>{cat}</div>
                <div className="h-bar-track">
                  <div className="h-bar-fill" style={{width:`${Math.round((cnt/maxCat)*100)}%`, background:CAT_COLORS[i]||'var(--navy)'}}>
                    {cnt >= 2 && <span>{cnt}</span>}
                  </div>
                </div>
                <div className="h-bar-count">{cnt}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="card card-pad">
          <div className="chart-title">Regulatory Flag Distribution</div>
          {flagCounts.length===0
            ? <div style={{color:'var(--gray-400)',fontSize:12,textAlign:'center',padding:24}}>No regulatory flags</div>
            : (
              <div>
                {flagCounts.map(({flag,count},i)=>(
                  <div key={i} className="h-bar-row" style={{marginBottom:8}}>
                    <div style={{width:50,fontSize:11,fontWeight:700,flexShrink:0}}><RegBadge flag={flag}/></div>
                    <div className="h-bar-track" style={{flex:1}}>
                      <div className="h-bar-fill" style={{
                        width:`${Math.round((count/Math.max(...flagCounts.map(x=>x.count)))*100)}%`,
                        background:{RESPA:'var(--purple)',FCRA:'#9D174D',UDAAP:'var(--amber)',ECOA:'var(--emerald)',FDCPA:'var(--sky)'}[flag]||'var(--navy)'
                      }}>
                        {count >= 1 && <span>{count}</span>}
                      </div>
                    </div>
                    <div className="h-bar-count">{count}</div>
                  </div>
                ))}
                <div style={{marginTop:12,padding:'10px',background:'var(--gray-50)',borderRadius:8}}>
                  <div style={{fontSize:11,color:'var(--gray-500)',marginBottom:6,fontWeight:600}}>HIGHEST EXPOSURE</div>
                  {flagCounts[0] && <div style={{fontSize:13,fontWeight:700,color:'var(--navy)'}}>{flagCounts[0].flag} · {flagCounts[0].count} case{flagCounts[0].count!==1?'s':''}</div>}
                </div>
              </div>
            )
          }
        </div>
      </div>

      <div className="card card-pad">
        <div className="chart-title">Branch Complaint Volume</div>
        <div className="h-bars">
          {branchCounts.map(([branch,cnt],i)=>(
            <div key={i} className="h-bar-row">
              <div className="h-bar-lbl">{branch}</div>
              <div className="h-bar-track">
                <div className="h-bar-fill" style={{
                  width:`${Math.round((cnt/maxBranch)*100)}%`,
                  background: i===0 ? 'var(--red)' : i===1 ? 'var(--amber)' : 'var(--navy)'
                }}>
                  {cnt >= 2 && <span>{cnt}</span>}
                </div>
              </div>
              <div className="h-bar-count">{cnt}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

              <span style={{width:6,height:6,borderRadius:'50%',background:'var(--emerald)',display:'inline-block'}}/>
              AI Online
            </div>
            <RolePill role={role} onClick={()=>setShowRole(true)}/>
          </div>
        </div>

        <div className="content">
          {view==='dashboard'  && <DashboardScreen complaints={complaints} role={role} onSelect={setSelected} onNew={()=>setView('intake')}/>}
          {view==='intake'     && <IntakeScreen complaints={complaints} onSubmit={addComplaint}/>}
          {view==='classifier' && <ClassifierScreen/>}
          {view==='cfpb'       && <CFPBReportScreen complaints={complaints} role={role}/>}
          {view==='audit'      && <AuditLogScreen complaints={complaints} role={role} onSelectCase={handleSelectFromAudit}/>}
          {view==='analytics'  && <AnalyticsScreen complaints={complaints} role={role}/>}
        </div>
      </div>

      {/* CASE DRAWER */}
      {selected && (
        <CaseDrawer
          complaint={selected}
          role={role}
          onClose={()=>setSelected(null)}
          onUpdate={(id,changes)=>{ updateComplaint(id,changes); setSelected(prev=>({...prev,...changes})); }}
          showToast={showToast}
        />
      )}

      {/* ROLE MODAL */}
      {showRole && <RoleModal role={role} onSelect={setRole} onClose={()=>setShowRole(false)}/>}

      {/* TOAST */}
      <Toast message={toast} onDone={clearToast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(React.StrictMode, null, React.createElement(App))
);
</script>
</body>
</html>
