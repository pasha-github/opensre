<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>1FFC Complaint Management Portal — v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --navy:#0F2044;--navy-l:#1e3a6e;--navy-dim:rgba(15,32,68,.07);
  --blue-tint:#E8F0FE;--blue-mid:#BFDBFE;
  --amber:#F59E0B;--amber-bg:#FEF3C7;--amber-dk:#92400E;
  --emerald:#10B981;--emerald-bg:#D1FAE5;--emerald-dk:#065F46;
  --red:#EF4444;--red-bg:#FEE2E2;--red-dk:#991B1B;
  --purple:#8B5CF6;--purple-bg:#EDE9FE;--purple-dk:#5B21B6;
  --sky:#3B82F6;--sky-bg:#DBEAFE;
  --g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g300:#D1D5DB;
  --g400:#9CA3AF;--g500:#6B7280;--g600:#4B5563;--g700:#374151;--g900:#111827;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--g50);color:var(--g900);font-size:14px}
.app{display:flex;height:100vh;overflow:hidden}
/* SIDEBAR */
.sb{width:232px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo-row{display:flex;align-items:center;gap:8px}
.logo-badge{background:var(--amber);color:var(--g900);font-size:11px;font-weight:800;padding:3px 7px;border-radius:5px}
.logo-name{font-size:14px;font-weight:800;color:white;letter-spacing:.04em}
.logo-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:4px;letter-spacing:.04em;text-transform:uppercase}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-sec{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.1em;text-transform:uppercase;padding:10px 10px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.6);border:none;background:none;width:100%;text-align:left;transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.08);color:white}
.nav-item.active{background:rgba(255,255,255,.14);color:white;font-weight:600}
.nav-item.locked{opacity:.3;cursor:not-allowed;pointer-events:none}
.nav-icon{font-size:14px;flex-shrink:0;width:18px;text-align:center}
.nav-badge{margin-left:auto;padding:2px 6px;border-radius:10px;font-size:10px;font-weight:700}
.nb-red{background:var(--red);color:white}
.nb-amber{background:var(--amber);color:var(--g900)}
.nb-gray{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8)}
.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.user-pill{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.15);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.u-name{font-size:12px;font-weight:600;color:white}
.u-role{font-size:10px;color:rgba(255,255,255,.45);margin-top:1px}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:52px;background:white;border-bottom:1px solid var(--g200);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;z-index:10}
.topbar-title{font-size:15px;font-weight:700;color:var(--g900);flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:20px 24px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:'Inter',sans-serif;white-space:nowrap}
.btn-navy{background:var(--navy);color:white}.btn-navy:hover{background:var(--navy-l)}
.btn-sec{background:var(--g100);color:var(--g700);border:1px solid var(--g200)}.btn-sec:hover{background:var(--g200)}
.btn-green{background:var(--emerald);color:white}.btn-green:hover{background:#059669}
.btn-amber{background:var(--amber);color:white}
.btn-red{background:var(--red);color:white}
.btn-ghost{background:none;border:1.5px solid var(--g200);color:var(--g600)}.btn-ghost:hover{border-color:var(--navy);color:var(--navy)}
.btn-sm{padding:5px 11px;font-size:11.5px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* CARDS */
.card{background:white;border-radius:10px;border:1px solid var(--g200)}
.cp{padding:18px 20px}
/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:white;border:1px solid var(--g200);border-radius:10px;padding:16px 18px}
.kpi.al{border-left:4px solid var(--amber)}
.kpi.nl{border-left:4px solid var(--navy)}
.kpi.rl{border-left:4px solid var(--red)}
.kpi.el{border-left:4px solid var(--emerald)}
.kpi-label{font-size:10.5px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.05em}
.kpi-val{font-size:26px;font-weight:800;color:var(--g900);margin:4px 0 2px;line-height:1}
.kpi-sub{font-size:11px;color:var(--g500)}
/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.bo{background:var(--sky-bg);color:#1D4ED8}
.br{background:var(--amber-bg);color:var(--amber-dk)}
.bres{background:var(--emerald-bg);color:var(--emerald-dk)}
.bcl{background:var(--g100);color:var(--g600)}
.besc{background:var(--red-bg);color:var(--red-dk)}
.bcrit{background:var(--red-bg);color:var(--red-dk)}
.bhi{background:var(--amber-bg);color:var(--amber-dk)}
.bmed{background:var(--sky-bg);color:#1D4ED8}
.blo{background:var(--g100);color:var(--g600)}
.bRESPA{background:var(--purple-bg);color:var(--purple-dk)}
.bFCRA{background:#FCE7F3;color:#9D174D}
.bUDAAP{background:var(--amber-bg);color:var(--amber-dk)}
.bECOA{background:var(--emerald-bg);color:var(--emerald-dk)}
.bFDCPA{background:var(--sky-bg);color:#1D4ED8}
.bnone{background:var(--g100);color:var(--g500)}
/* TABLE */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;padding:9px 14px;border-bottom:1px solid var(--g200);background:var(--g50);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--g100);font-size:12.5px;color:var(--g700);vertical-align:middle}
.tbl tr:hover td{background:var(--blue-tint);cursor:pointer}
.tbl tr.nh:hover td{background:none;cursor:default}
.case-id{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500;color:var(--navy)}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--g500)}
/* SLA */
.sla{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500}
.sla-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sla-ok{color:var(--emerald)}.sla-ok .sla-dot{background:var(--emerald)}
.sla-warn{color:var(--amber)}.sla-warn .sla-dot{background:var(--amber);animation:pulse 1s infinite}
.sla-breach{color:var(--red)}.sla-breach .sla-dot{background:var(--red);animation:pulse .7s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
/* DRAWER */
.drawer-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;justify-content:flex-end}
.drawer{width:500px;background:white;height:100%;overflow-y:auto;box-shadow:-6px 0 32px rgba(0,0,0,.18);display:flex;flex-direction:column}
.dw-hdr{padding:18px 20px;display:flex;align-items:flex-start;gap:12px;background:var(--navy);flex-shrink:0}
.dw-info{flex:1;min-width:0}
.dw-id{font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(255,255,255,.6);margin-bottom:3px}
.dw-name{font-size:16px;font-weight:700;color:white;margin-bottom:2px}
.dw-sub{font-size:12px;color:rgba(255,255,255,.55)}
.dw-close{background:rgba(255,255,255,.12);border:none;color:white;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dw-body{padding:18px 20px;flex:1}
.dw-sec{margin-bottom:18px}
.dw-sec-title{font-size:11px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.di label{font-size:10.5px;font-weight:600;color:var(--g500);display:block;margin-bottom:2px}
.di span{font-size:13px;color:var(--g900)}
.narr{background:var(--g50);border:1px solid var(--g200);border-radius:8px;padding:12px;font-size:12.5px;color:var(--g700);line-height:1.6}
/* TIMELINE */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--g200)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{position:absolute;left:-19px;top:3px;width:10px;height:10px;border-radius:50%;background:white;border:2px solid var(--g300)}
.tl-dot.create{border-color:var(--navy);background:var(--navy)}
.tl-dot.classify{border-color:var(--purple);background:var(--purple)}
.tl-dot.status{border-color:var(--amber);background:var(--amber)}
.tl-dot.assign{border-color:var(--emerald);background:var(--emerald)}
.tl-dot.note{border-color:var(--g400);background:var(--g400)}
.tl-dot.rule{border-color:var(--sky);background:var(--sky)}
.tl-ts{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--g400);margin-bottom:2px}
.tl-action{font-size:12.5px;color:var(--g700);line-height:1.4}
.tl-actor{font-size:11px;font-weight:600;color:var(--g500);margin-top:2px}
/* FORM */
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11.5px;font-weight:600;color:var(--g600)}
.fg.full{grid-column:1/-1}
input,select,textarea{padding:9px 11px;border:1.5px solid var(--g200);border-radius:7px;font-size:13px;font-family:'Inter',sans-serif;color:var(--g900);background:white;transition:border-color .15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-dim)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
.ferr{font-size:11px;color:var(--red);margin-top:2px}
/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:white;border-radius:14px;padding:24px;width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.22)}
.modal-title{font-size:17px;font-weight:800;color:var(--g900);margin-bottom:4px}
.modal-sub{font-size:12.5px;color:var(--g500);margin-bottom:20px}
.role-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.role-card{border:2px solid var(--g200);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;text-align:left;background:white}
.role-card:hover{border-color:var(--navy);background:var(--blue-tint)}
.role-card.sel{border-color:var(--navy);background:var(--blue-tint)}
.rc-icon{font-size:22px;margin-bottom:8px}
.rc-title{font-size:12.5px;font-weight:700;color:var(--g900);margin-bottom:3px}
.rc-desc{font-size:11px;color:var(--g500);margin-bottom:10px;line-height:1.4}
.perm{display:flex;align-items:center;gap:5px;font-size:10.5px;margin-bottom:3px}
/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:white;padding:11px 16px;border-radius:9px;font-size:12.5px;font-weight:500;z-index:999;box-shadow:0 6px 24px rgba(0,0,0,.2);animation:slideUp .2s ease;max-width:400px}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* ROLE PILL */
.role-pill{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;cursor:pointer;border:1.5px solid;transition:all .15s}
.role-pill:hover{opacity:.85}
/* TOGGLE */
.toggle{width:36px;height:20px;border-radius:10px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle-thumb{width:16px;height:16px;border-radius:50%;background:white;position:absolute;top:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
/* WORKFLOW BUILDER */
.wf-shell{display:grid;grid-template-columns:380px 1fr;gap:16px;margin-bottom:16px;align-items:start}
.rule-card{background:white;border:1.5px solid var(--g200);border-radius:9px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all .15s;display:flex;gap:10px;align-items:flex-start}
.rule-card:hover{border-color:var(--navy);box-shadow:0 2px 8px rgba(15,32,68,.08)}
.rule-card.active{border-color:var(--navy);background:var(--blue-tint);box-shadow:0 2px 8px rgba(15,32,68,.12)}
.rule-card.drag-over{border-color:var(--amber);border-style:dashed}
.rule-card.dragging{opacity:.4}
.drag-handle{color:var(--g300);font-size:16px;cursor:grab;flex-shrink:0;padding-top:2px;user-select:none}
.drag-handle:active{cursor:grabbing}
.rule-priority{width:22px;height:22px;border-radius:50%;background:var(--navy);color:white;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rule-body{flex:1;min-width:0}
.rule-name{font-size:13px;font-weight:700;color:var(--g900);margin-bottom:3px}
.rule-cond-summary{font-size:11.5px;color:var(--g600);margin-bottom:6px;line-height:1.4}
.rule-action-chips{display:flex;gap:4px;flex-wrap:wrap}
.action-chip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--blue-tint);color:var(--navy)}
.rule-controls{display:flex;align-items:center;gap:8px;flex-shrink:0}
/* RULE EDITOR */
.editor-panel{background:white;border-radius:10px;border:1.5px solid var(--g200);overflow:hidden}
.editor-hdr{padding:16px 20px;border-bottom:1px solid var(--g200);background:var(--navy);display:flex;align-items:center;gap:10px}
.editor-body{padding:20px}
.cond-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cond-row select{padding:7px 9px;font-size:12px;flex:1;min-width:100px}
.cond-row .operator{min-width:90px;flex:0 0 auto}
.cond-row input{padding:7px 9px;font-size:12px;flex:1;min-width:100px}
.remove-btn{background:none;border:none;color:var(--g400);cursor:pointer;font-size:16px;flex-shrink:0;padding:2px 4px;border-radius:4px}
.remove-btn:hover{color:var(--red);background:var(--red-bg)}
.action-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.action-row select{padding:7px 9px;font-size:12px;flex:1;min-width:120px}
.action-row input{padding:7px 9px;font-size:12px;flex:1;min-width:120px}
.logic-toggle{display:flex;gap:4px}
.lt-btn{padding:4px 12px;border-radius:6px;font-size:11px;font-weight:700;border:1.5px solid var(--g200);background:white;cursor:pointer;color:var(--g600);transition:all .15s}
.lt-btn.active{background:var(--navy);color:white;border-color:var(--navy)}
/* TESTER */
.tester{background:white;border:1.5px solid var(--g200);border-radius:10px;padding:20px}
.test-result-row{display:grid;grid-template-columns:180px 60px 1fr 1fr;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--g100);font-size:12.5px}
.test-result-row:last-child{border:none}
.test-result-hdr{background:var(--g50);font-size:10.5px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.04em;padding:8px 14px;display:grid;grid-template-columns:180px 60px 1fr 1fr;gap:12px;border-bottom:1px solid var(--g200);border-radius:8px 8px 0 0}
/* ANALYTICS */
.an-grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.an-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.chart-title{font-size:13px;font-weight:700;color:var(--g900);margin-bottom:14px}
.v-bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding:0 2px}
.v-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.v-val{font-size:10px;font-weight:700;color:var(--g600)}
.v-fill{width:100%;border-radius:3px 3px 0 0;min-height:4px}
.v-lbl{font-size:10px;color:var(--g500);text-align:center;line-height:1.2}
.h-bars{display:flex;flex-direction:column;gap:7px}
.h-row{display:flex;align-items:center;gap:8px}
.h-lbl{width:120px;font-size:11.5px;color:var(--g600);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-track{flex:1;height:22px;background:var(--g100);border-radius:4px;overflow:hidden}
.h-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;transition:width .6s ease}
.h-fill span{font-size:11px;font-weight:700;color:white}
.h-cnt{width:28px;font-size:11.5px;font-weight:600;color:var(--g700);text-align:right;flex-shrink:0}
/* SPARKLINE */
.spark{display:flex;align-items:flex-end;gap:3px;height:50px}
.spark-bar{flex:1;border-radius:2px 2px 0 0;min-height:3px;transition:height .4s ease}
/* HEATMAP */
.heatmap-tbl{width:100%;border-collapse:collapse;font-size:12px}
.heatmap-tbl th{text-align:center;font-size:10px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--g200);background:var(--g50)}
.heatmap-tbl th:first-child{text-align:left}
.heatmap-tbl td{padding:9px 10px;border-bottom:1px solid var(--g100);text-align:center;font-weight:600}
.heatmap-tbl td:first-child{text-align:left;font-weight:600;color:var(--g900);font-size:12px}
/* GAUGE */
.gauge-wrap{display:flex;flex-direction:column;align-items:center}
.gauge-ring{position:relative;width:90px;height:90px;margin-bottom:8px}
.gauge-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-pct{font-size:20px;font-weight:800;color:var(--g900)}
.gauge-lbl{font-size:10px;color:var(--g500)}
/* MISC */
.divider{height:1px;background:var(--g200);margin:14px 0}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-size:14.5px;font-weight:700;color:var(--g900)}
.pill-tabs{display:flex;gap:4px;background:var(--g100);padding:3px;border-radius:8px}
.ptab{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--g600);transition:all .15s;font-family:'Inter',sans-serif}
.ptab.active{background:white;color:var(--g900);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.access-wall{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:12px;color:var(--g500)}
.aw-icon{font-size:48px}
.aw-title{font-size:16px;font-weight:700;color:var(--g700)}
.aw-desc{font-size:13px;max-width:320px;text-align:center;line-height:1.5}
.info-bar{padding:11px 14px;background:var(--blue-tint);border-radius:9px;border:1px solid var(--blue-mid);font-size:12px;color:var(--navy);line-height:1.6;margin-top:14px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--g300);border-radius:3px}
</style>
</head>
<body>
<div id="root" style="display:flex;height:100vh;align-items:center;justify-content:center;font-family:Inter,sans-serif;color:#6B7280;font-size:13px">Initializing…</div>

// ── RULE ENGINE ──────────────────────────────────────────────────────
function matchCond(c,cond){
  const v=String(c[cond.field]||'');
  if(cond.op==='eq')      return v===cond.value;
  if(cond.op==='neq')     return v!==cond.value;
  if(cond.op==='contains')return v.toLowerCase().includes((cond.value||'').toLowerCase());
  return false;
}
function matchRule(complaint,rule){
  if(!rule.conditions.length)return false;
  const res=rule.conditions.map(c=>matchCond(complaint,c));
  return rule.condLogic==='OR'?res.some(Boolean):res.every(Boolean);
}
function applyRules(complaint,rules){
  const sorted=[...rules].filter(r=>r.enabled).sort((a,b)=>a.priority-b.priority);
  let cur={...complaint};
  const fired=[];
  const ruleEvents=[];
  for(const rule of sorted){
    if(matchRule(cur,rule)){
      fired.push(rule);
      rule.actions.forEach((a,i)=>{
        if(a.type==='assign_to')    cur={...cur,assignedTo:a.value};
        if(a.type==='set_priority') cur={...cur,priority:a.value};
        if(a.type==='set_status')   cur={...cur,status:a.value};
        if(a.type==='add_note') ruleEvents.push({
          id:`${complaint.id}-rule-${rule.id}-${i}`,caseId:complaint.id,
          ts:new Date().toISOString(),actor:'Workflow Engine',actorRole:'System',
          action:`⚡ [${rule.name}] ${a.value}`,type:'rule',
        });
      });
    }
  }
  if(ruleEvents.length) cur={...cur,auditTrail:[...(cur.auditTrail||[]),...ruleEvents]};
  return{result:cur,fired};
}

function getSLA(c){
  const diff=new Date(c.slaDeadline)-Date.now();
  if(diff<0)return{s:'breach',label:'BREACHED',cls:'sla-breach'};
  const hrs=diff/3600000;
  if(hrs<4)return{s:'warn',label:`${Math.ceil(hrs)}h left`,cls:'sla-warn'};
  const days=Math.floor(hrs/24),remH=Math.ceil(hrs%24);
  return{s:'ok',label:days>0?`${days}d ${remH}h`:`${Math.ceil(hrs)}h`,cls:'sla-ok'};
}
function useTick(){const[t,setT]=useState(0);useEffect(()=>{const id=setInterval(()=>setT(x=>x+1),1000);return()=>clearInterval(id);},[]);return t;}
function exportCSV(rows,fn){if(!rows.length)return;const h=Object.keys(rows[0]);const csv=[h.join(','),...rows.map(r=>h.map(k=>`"${String(r[k]||'').replace(/"/g,'""')}"`).join(','))].join('\n');const b=new Blob([csv],{type:'text/csv'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=fn;a.click();URL.revokeObjectURL(u);}

      </div>)}
    </div>}
    <div style={{fontSize:13,color:'var(--g600)',marginBottom:24}}>Case created, classified, and routing rules applied. Customer acknowledgment sent within 1 business day.</div>
    <button className="btn btn-navy" onClick={()=>{setSuccess(null);setRulesFired([]);setForm({customerName:'',accountLast4:'',channel:'Phone',branch:'',state:'',category:'',issue:'',priority:'Medium',narrative:''});}}>Submit Another</button>
  </div>;

// ── AI CLASSIFIER ────────────────────────────────────────────────────
const EXAMPLES=[
  {l:'Mortgage double-payment',t:'My mortgage payment was debited twice from my checking account on the 15th. The duplicate charge of $2,847 caused an overdraft. Three calls to customer service have not resolved it.'},
  {l:'Credit card fraud dispute',t:'There is an unauthorized charge of $349 from an unfamiliar online retailer on my credit card statement. I have never made a purchase from this company. This appears to be fraud.'},
  {l:'FDCPA harassment complaint',t:'A debt collector has been calling me up to 8 times per day, called my employer and disclosed my debt to my HR manager, and threatened legal action at 9pm. These are clear FDCPA violations.'},
];
function classify(t){
  const txt=t.toLowerCase();
  if(txt.includes('mortgage')||txt.includes('escrow'))return{cat:'Mortgage',issue:'Payment processing, late fee',conf:94,sent:'Frustrated',pri:'High',flag:'RESPA',flagReason:'RESPA Section 6 requires timely response to written requests and error resolution.',sigs:['Mortgage servicing context','Payment error disputed','Escrow or billing dispute possible'],action:'Acknowledge within 5 days. Investigate payment records. Provide RESPA-compliant written response within 30 days.'};
  if(txt.includes('unauthorized')||txt.includes('fraud'))return{cat:'Credit card or prepaid card',issue:'Problem with a purchase shown on your statement',conf:91,sent:'Alarmed',pri:'High',flag:'FCRA',flagReason:'FCRA Section 611 requires investigation of disputed account information.',sigs:['Unauthorized transaction disputed','Fraud indicators present','Customer denies transaction'],action:'Issue provisional credit within 5 days. Complete investigation within 30 days.'};
  if(txt.includes('collector')||txt.includes('fdcpa')||txt.includes('harassment'))return{cat:'Debt collection',issue:'Took or threatened to take negative or legal action',conf:97,sent:'Distressed',pri:'Critical',flag:'FDCPA',flagReason:'FDCPA Section 806 prohibits harassment. Section 805 prohibits third-party contact.',sigs:['Multiple calls per day alleged','Third-party employer disclosure','Threatening language — after hours'],action:'Suspend collection activity immediately. Escalate to Compliance Director. Respond within 15 days.'};
  if(txt.includes('credit report')||txt.includes('credit score'))return{cat:'Credit reporting',issue:'Incorrect information on your report',conf:98,sent:'Concerned',pri:'High',flag:'FCRA',flagReason:'FCRA Section 611 requires CRAs to investigate disputes and correct inaccurate info.',sigs:['Credit report inaccuracy disputed','Score impact stated','Furnisher error possible'],action:'Conduct reasonable investigation within 30 days. Correct or delete. Notify consumer of results.'};
  return{cat:'Checking or savings account',issue:'Managing an account',conf:81,sent:'Frustrated',pri:'Medium',flag:null,flagReason:'No specific regulatory trigger. Monitor for pattern.',sigs:['General account servicing complaint','No acute regulatory trigger','Standard resolution path'],action:'Acknowledge within 1 business day. Investigate account records. Respond within 30 days.'};
}

          </div>
        </div>
        {res.flag&&<div style={{background:'#FEF3C7',border:'1px solid #FDE68A',borderRadius:7,padding:'9px 12px',margin:'10px 0',fontSize:11.5,color:'var(--amber-dk)',lineHeight:1.5}}>⚖️ <strong>{res.flag}:</strong> {res.flagReason}</div>}
        <div style={{marginTop:10}}>

        <div style={{marginTop:14,background:'var(--blue-tint)',borderRadius:8,padding:'11px 13px'}}>

          <div style={{fontSize:12.5,color:'var(--navy)',lineHeight:1.5}}>{res.action}</div>

// ── CFPB REPORT ──────────────────────────────────────────────────────
function CFPBScreen({complaints,role}){
  const[cat,setCat]=useState('All');const[st,setSt]=useState('All');const[fl,setFl]=useState('All');const[stat,setStat]=useState('All');
  if(!ROLES_CFG[role].perms['CFPB Export'])return<div className="access-wall"><div className="aw-icon">🔒</div><div className="aw-title">Access Restricted</div><div className="aw-desc">CFPB Reports require Compliance Officer or Administrator role.</div></div>;
  const rows=complaints.filter(c=>{
    if(cat!=='All'&&c.category!==cat)return false;
    if(st!=='All'&&c.state!==st)return false;
    if(fl==='None'&&c.regulatoryFlag)return false;
    if(fl!=='All'&&fl!=='None'&&c.regulatoryFlag!==fl)return false;
    if(stat!=='All'&&c.status!==stat)return false;
    return true;
  });

  const open=rows.filter(c=>['Open','In Review','Escalated'].includes(c.status)).length;
  const timely=rows.filter(c=>c.status==='Resolved'&&getSLA(c).s!=='breach').length;
  const doExport=()=>exportCSV(rows.map(c=>({'Case ID':c.id,'Date':fmtD(c.submittedAt),'State':c.state,'Branch':c.branch,'Channel':c.channel,'CFPB Product':c.category,'Issue':c.issue,'Priority':c.priority,'Status':c.status,'Timely':getSLA(c).s!=='breach'?'Yes':'No','Reg Flag':c.regulatoryFlag||'','Assigned':c.assignedTo||''})),`1FFC_CFPB_${new Date().toISOString().split('T')[0]}.csv`);
  return<div>

      {[['Total',rows.length,''],['Reg. Flags',flagged,'var(--red)'],['Open/Pending',open,'var(--amber)'],['Timely',timely,'var(--emerald)'],['Resolution %',rows.length>0?Math.round(rows.filter(c=>c.status==='Resolved').length/rows.length*100)+'%':'-','']].map(([l,v,c],i)=><div key={i} style={{background:'white',border:'1px solid var(--g200)',borderRadius:8,padding:'12px 14px',textAlign:'center'}}><div style={{fontSize:20,fontWeight:800,color:c||'var(--g900)'}}>{v}</div><div style={{fontSize:10,fontWeight:600,color:'var(--g500)',textTransform:'uppercase',letterSpacing:'.04em',marginTop:2}}>{l}</div></div>)}
    </div>
    <div style={{display:'flex',gap:10,flexWrap:'wrap',padding:'12px 16px',background:'var(--g50)',borderRadius:9,marginBottom:18,border:'1px solid var(--g200)'}}>
      {[['Category',cat,setCat,['All',...new Set(complaints.map(c=>c.category))]],['State',st,setSt,['All',...STATES]],['Reg. Flag',fl,setFl,['All','RESPA','FCRA','UDAAP','ECOA','FDCPA','None']],['Status',stat,setStat,['All','Open','In Review','Escalated','Resolved','Closed']]].map(([l,v,s,opts],i)=><div key={i} style={{display:'flex',flexDirection:'column',gap:4}}><label style={{fontSize:10.5,fontWeight:600,color:'var(--g500)'}}>{l}</label><select value={v} onChange={e=>s(e.target.value)} style={{padding:'6px 10px',fontSize:12,minWidth:140,outline:'none'}}>{opts.map(o=><option key={o}>{o}</option>)}</select></div>)}
    </div>
    <div className="card" style={{overflowX:'auto'}}>
      <table className="tbl">
        <thead><tr><th>Case ID</th><th>Date</th><th>State</th><th>CFPB Product</th><th>Priority</th><th>Status</th><th>Timely</th><th>Reg. Flag</th><th>Assigned</th></tr></thead>
        <tbody>
          {!rows.length&&<tr className="nh"><td colSpan={9} style={{textAlign:'center',padding:28,color:'var(--g500)'}}>No records match filters.</td></tr>}
          {rows.map(c=>{const sl=getSLA(c);const tm=c.status==='Resolved'&&sl.s!=='breach';return<tr key={c.id} className="nh">
            <td><span className="case-id">{c.id}</span></td>

// ── WORKFLOW BUILDER ─────────────────────────────────────────────────
function WorkflowScreen({rules,onUpdate,complaints,role,showToast}){
  const[editing,setEditing]=useState(null);
  const[dragId,setDragId]=useState(null);
  const[overId,setOverId]=useState(null);
  const[testCaseId,setTestCaseId]=useState(complaints[0]?.id||'');
  const[testRes,setTestRes]=useState(null);
  const[showTester,setShowTester]=useState(false);
  const totalFired=complaints.flatMap(c=>c.auditTrail).filter(e=>e.type==='rule').length;

  if(!ROLES_CFG[role].perms['Workflow Builder'])return<div className="access-wall"><div className="aw-icon">🔒</div><div className="aw-title">Access Restricted</div><div className="aw-desc">Workflow Builder requires Compliance Officer or Administrator role.</div></div>;

  // DnD
  const onDragStart=(e,id)=>{setDragId(id);e.dataTransfer.effectAllowed='move';};
  const onDragOver=(e,id)=>{e.preventDefault();setOverId(id);};
  const onDrop=(e,targetId)=>{
    e.preventDefault();
    if(dragId===targetId){setDragId(null);setOverId(null);return;}
    const arr=[...rules];
    const from=arr.findIndex(r=>r.id===dragId),to=arr.findIndex(r=>r.id===targetId);
    const[moved]=arr.splice(from,1);arr.splice(to,0,moved);
    onUpdate(arr.map((r,i)=>({...r,priority:i+1})));
    setDragId(null);setOverId(null);
    showToast('⚡ Rule priority reordered');
  };
  const onDragEnd=()=>{setDragId(null);setOverId(null);};

  const toggleRule=(id,val)=>onUpdate(rules.map(r=>r.id===id?{...r,enabled:val}:r));
  const addRule=()=>{
    const nr={id:uid(),priority:rules.length+1,enabled:true,name:'New Rule',desc:'',conditions:[{field:'category',op:'eq',value:''}],condLogic:'AND',actions:[{type:'assign_to',value:''}]};
    onUpdate([...rules,nr]);setEditing(nr);
  };
  const saveRule=edited=>{
    onUpdate(rules.map(r=>r.id===edited.id?edited:r));
    setEditing(null);showToast('✅ Rule saved');
  };
  const deleteRule=id=>{onUpdate(rules.filter(r=>r.id!==id));setEditing(null);showToast('🗑 Rule deleted');};

  const runTest=()=>{
    const c=complaints.find(x=>x.id===testCaseId);
    if(!c)return;
    const res=rules.filter(r=>r.enabled).sort((a,b)=>a.priority-b.priority).map(rule=>{
      const condRes=rule.conditions.map(cond=>({cond,matched:matchCond(c,cond)}));
      const matched=rule.condLogic==='OR'?condRes.some(x=>x.matched):condRes.every(x=>x.matched);
      return{rule,condRes,matched};
    });
    setTestRes(res);
  };

  const condSummary=r=>r.conditions.map(c=>`${c.field} ${c.op==='eq'?'=':c.op==='neq'?'≠':'contains'} "${c.value}"`).join(` ${r.condLogic} `);
  const actSummary=r=>r.actions.map(a=>`${a.type.replace('_',' ')}: ${a.value||'…'}`);

  return<div>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
      <div>
        <div style={{fontSize:17,fontWeight:800,marginBottom:2}}>Workflow &amp; Routing Rules</div>
        <div style={{fontSize:12.5,color:'var(--g500)'}}>{rules.filter(r=>r.enabled).length} of {rules.length} rules active · {totalFired} automation events fired</div>
      </div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>setShowTester(t=>!t)}>{showTester?'Hide':'▶ Live Tester'}</button>
        <button className="btn btn-navy btn-sm" onClick={addRule}>+ Add Rule</button>
      </div>
    </div>

    <div className="wf-shell">
      {/* Rule List */}
      <div>
        <div style={{fontSize:11,fontWeight:700,color:'var(--g500)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:10}}>Rules (drag to reorder priority)</div>
        {rules.map(rule=><div key={rule.id}
          className={`rule-card ${editing?.id===rule.id?'active':''} ${overId===rule.id&&dragId!==rule.id?'drag-over':''} ${dragId===rule.id?'dragging':''}`}
          draggable onDragStart={e=>onDragStart(e,rule.id)} onDragOver={e=>onDragOver(e,rule.id)} onDrop={e=>onDrop(e,rule.id)} onDragEnd={onDragEnd}
        >
          <span className="drag-handle" title="Drag to reorder">⋮⋮</span>
          <div className="rule-priority">{rule.priority}</div>
          <div className="rule-body">
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
              <div className="rule-name" style={{opacity:rule.enabled?1:.45}}>{rule.name}</div>
              {!rule.enabled&&<span className="badge bcl" style={{fontSize:9,padding:'1px 5px'}}>OFF</span>}
            </div>
            <div className="rule-cond-summary" style={{opacity:rule.enabled?1:.45}}>{condSummary(rule)||'No conditions'}</div>
            <div className="rule-action-chips">
              {actSummary(rule).map((a,i)=><span key={i} className="action-chip">{a}</span>)}
            </div>
          </div>
          <div className="rule-controls">
            <Toggle val={rule.enabled} onChange={v=>toggleRule(rule.id,v)}/>
            <button style={{background:'none',border:'none',cursor:'pointer',fontSize:14,color:'var(--g500)',padding:'2px 4px',borderRadius:4}} onClick={()=>setEditing(editing?.id===rule.id?null:rule)} title="Edit">✏️</button>
          </div>
        </div>)}
        {!rules.length&&<div style={{textAlign:'center',padding:32,color:'var(--g400)',fontSize:13}}>No rules yet. Click + Add Rule.</div>}
      </div>

      {/* Rule Editor */}
      <div>
        {!editing?<div className="editor-panel" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:320,color:'var(--g400)'}}>
          <div style={{fontSize:36,marginBottom:12}}>⚙️</div>
          <div style={{fontSize:13,fontWeight:600,color:'var(--g600)',marginBottom:4}}>Select a rule to edit</div>
          <div style={{fontSize:12,color:'var(--g400)'}}>Or click + Add Rule to create a new one</div>
        </div>:<RuleEditor key={editing.id} rule={editing} onSave={saveRule} onDelete={deleteRule} onCancel={()=>setEditing(null)}/>}
      </div>
    </div>

    {/* Live Tester */}
    {showTester&&<div className="tester">
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
        <div style={{fontSize:14,fontWeight:700,color:'var(--g900)'}}>▶ Live Rule Tester</div>
        <select value={testCaseId} onChange={e=>{setTestCaseId(e.target.value);setTestRes(null);}} style={{padding:'6px 10px',border:'1.5px solid var(--g200)',borderRadius:7,fontSize:12,outline:'none',flex:1,maxWidth:320}}>
          {complaints.map(c=><option key={c.id} value={c.id}>{c.id} — {c.customerName} ({c.category.split(' ')[0]})</option>)}
        </select>
        <button className="btn btn-navy btn-sm" onClick={runTest}>Run Test</button>
        {testRes&&<span style={{fontSize:12,color:'var(--g500)'}}>{testRes.filter(x=>x.matched).length} rule{testRes.filter(x=>x.matched).length!==1?'s':''} would fire</span>}
      </div>

      {testRes&&<>
        <div className="test-result-hdr"><div>Rule</div><div>Match</div><div>Conditions</div><div>Actions Applied</div></div>
        {testRes.map(({rule,condRes,matched},i)=><div key={i} className="test-result-row" style={{background:matched?'#F0FDF4':'white'}}>
          <div>
            <div style={{fontWeight:600,color:'var(--g900)',fontSize:13}}>{rule.name}</div>
            <div style={{fontSize:10.5,color:'var(--g500)',marginTop:1}}>Priority {rule.priority} · {rule.condLogic}</div>
          </div>
          <div>
            <span className={`badge ${matched?'bres':'bcl'}`} style={{fontSize:12,padding:'4px 8px'}}>{matched?'✓ YES':'✕ NO'}</span>
          </div>
          <div style={{fontSize:11.5}}>
            {condRes.map(({cond,matched:cm},j)=><div key={j} style={{display:'flex',alignItems:'center',gap:5,marginBottom:3}}>
              <span style={{color:cm?'var(--emerald)':'var(--red)',fontWeight:700,fontSize:13}}>{cm?'✓':'✕'}</span>
              <span style={{color:'var(--g700)'}}>{cond.field} {cond.op==='eq'?'=':cond.op==='neq'?'≠':'contains'} <strong>"{cond.value}"</strong></span>
            </div>)}
          </div>
          <div style={{fontSize:11.5}}>
            {matched?rule.actions.map((a,j)=><div key={j} style={{marginBottom:3}}>
              <span className="action-chip">{a.type.replace('_',' ')}: {a.value}</span>
            </div>):<span style={{color:'var(--g400)',fontSize:11}}>No actions (rule did not match)</span>}
          </div>
        </div>)}

        {testRes.some(x=>x.matched)&&<div style={{marginTop:14,background:'var(--blue-tint)',borderRadius:9,padding:'12px 16px'}}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--navy)',marginBottom:8}}>After Rules Fire — Case Would Be Updated To:</div>
          {(()=>{const c=complaints.find(x=>x.id===testCaseId);const{result}=applyRules({...c},rules.filter(r=>r.enabled));
            return<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,fontSize:12}}>
              {[['Assigned To',c.assignedTo||'Unassigned','→',result.assignedTo||'Unassigned'],['Priority',c.priority,'→',result.priority],['Status',c.status,'→',result.status]].map(([l,from,arr,to],i)=><div key={i} style={{background:'white',borderRadius:7,padding:'10px 12px'}}>
                <div style={{fontSize:10,fontWeight:600,color:'var(--g500)',textTransform:'uppercase',marginBottom:5}}>{l}</div>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <span style={{color:from!==to?'var(--red)':'var(--g600)',textDecoration:from!==to?'line-through':'none',fontSize:11}}>{from}</span>
                  {from!==to&&<><span style={{color:'var(--g400)'}}>→</span><span style={{color:'var(--emerald)',fontWeight:700,fontSize:11}}>{to}</span></>}
                </div>
              </div>);}
            </div>;
          })()}
        </div>}
      </>}
    </div>}
  </div>;
}

// ── RULE EDITOR ──────────────────────────────────────────────────────
function RuleEditor({rule,onSave,onDelete,onCancel}){
  const[name,setName]=useState(rule.name);
  const[desc,setDesc]=useState(rule.desc||'');
  const[conds,setConds]=useState(rule.conditions.length?rule.conditions:[{field:'category',op:'eq',value:''}]);
  const[acts,setActs]=useState(rule.actions.length?rule.actions:[{type:'assign_to',value:''}]);
  const[logic,setLogic]=useState(rule.condLogic||'AND');
  const[enabled,setEnabled]=useState(rule.enabled);

  const setCond=(i,k,v)=>setConds(cs=>cs.map((c,j)=>j===i?{...c,[k]:v,...(k==='field'?{value:''}:{})}:c));
  const addCond=()=>conds.length<4&&setConds(cs=>[...cs,{field:'category',op:'eq',value:''}]);
  const remCond=i=>setConds(cs=>cs.filter((_,j)=>j!==i));
  const setAct=(i,k,v)=>setActs(as=>as.map((a,j)=>j===i?{...a,[k]:v,...(k==='type'?{value:''}:{})}:a));
  const addAct=()=>acts.length<4&&setActs(as=>[...as,{type:'assign_to',value:''}]);
  const remAct=i=>setActs(as=>as.filter((_,j)=>j!==i));

  const save=()=>onSave({...rule,name,desc,conditions:conds,actions:acts,condLogic:logic,enabled});

  return<div className="editor-panel">
    <div className="editor-hdr">
      <div style={{flex:1}}>
        <input value={name} onChange={e=>setName(e.target.value)} style={{background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.2)',color:'white',borderRadius:6,padding:'6px 10px',fontSize:14,fontWeight:700,width:'100%',outline:'none'}} placeholder="Rule name"/>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
        <span style={{color:'rgba(255,255,255,.6)',fontSize:12}}>Enabled</span>
        <Toggle val={enabled} onChange={setEnabled}/>
      </div>
    </div>
    <div className="editor-body">
      <div className="fg" style={{marginBottom:14}}>
        <label>Description</label>
        <input value={desc} onChange={e=>setDesc(e.target.value)} placeholder="What does this rule do?"/>
      </div>

      <div style={{marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--g700)'}}>IF (Conditions)</div>
          <div className="logic-toggle">
            {['AND','OR'].map(l=><button key={l} className={`lt-btn ${logic===l?'active':''}`} onClick={()=>setLogic(l)}>{l}</button>)}
          </div>
          <span style={{fontSize:11,color:'var(--g400)'}}>{logic==='AND'?'All must match':'Any can match'}</span>
        </div>
        {conds.map((c,i)=>{
          const opts=FIELD_OPTS[c.field];
          return<div key={i} className="cond-row">
            <select value={c.field} onChange={e=>setCond(i,'field',e.target.value)} style={{flex:'0 0 140px'}}>{COND_FIELDS.map(f=><option key={f.v} value={f.v}>{f.l}</option>)}</select>
            <select value={c.op} onChange={e=>setCond(i,'op',e.target.value)} className="operator" style={{flex:'0 0 90px'}}>
              <option value="eq">equals</option><option value="neq">not equals</option><option value="contains">contains</option>
            </select>
            {opts?<select value={c.value} onChange={e=>setCond(i,'value',e.target.value)} style={{flex:1}}><option value="">— value —</option>{opts.map(o=><option key={o}>{o}</option>)}</select>
              :<input value={c.value} onChange={e=>setCond(i,'value',e.target.value)} placeholder="Value…" style={{flex:1}}/>}
            <button className="remove-btn" onClick={()=>remCond(i)} title="Remove">✕</button>
          </div>;
        })}
        {conds.length<4&&<button className="btn btn-ghost btn-xs" onClick={addCond} style={{marginTop:4}}>+ Add Condition</button>}
      </div>

      <div style={{marginBottom:16}}>
        <div style={{fontSize:12,fontWeight:700,color:'var(--g700)',marginBottom:10}}>THEN (Actions)</div>
        {acts.map((a,i)=>{
          const aOpts=ACT_OPTS[a.type];
          return<div key={i} className="action-row">
            <select value={a.type} onChange={e=>setAct(i,'type',e.target.value)} style={{flex:'0 0 140px'}}>{ACT_TYPES.map(t=><option key={t.v} value={t.v}>{t.l}</option>)}</select>
            {aOpts?<select value={a.value} onChange={e=>setAct(i,'value',e.target.value)} style={{flex:1}}><option value="">— value —</option>{aOpts.map(o=><option key={o}>{o}</option>)}</select>
              :<input value={a.value} onChange={e=>setAct(i,'value',e.target.value)} placeholder="Enter value…" style={{flex:1}}/>}
            <button className="remove-btn" onClick={()=>remAct(i)}>✕</button>
          </div>;
        })}
        {acts.length<4&&<button className="btn btn-ghost btn-xs" onClick={addAct} style={{marginTop:4}}>+ Add Action</button>}
      </div>

      <div className="divider"/>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-navy btn-sm" onClick={save}>Save Rule</button>
        <button className="btn btn-sec btn-sm" onClick={onCancel}>Cancel</button>
        <button className="btn btn-red btn-sm" style={{marginLeft:'auto'}} onClick={()=>onDelete(rule.id)}>Delete Rule</button>
      </div>
    </div>
  </div>;
}

// ── APP ──────────────────────────────────────────────────────────────
function App(){
  const[view,setView]=useState('dashboard');
  const[role,setRole]=useState('compliance');
  const[complaints,setComplaints]=useState(SEED);
  const[rules,setRules]=useState(DEFAULT_RULES);
  const[selected,setSelected]=useState(null);
  const[toast,setToast]=useState(null);
  const[showRole,setShowRole]=useState(false);
  const showToast=msg=>setToast(msg);

  const addComplaint=(c,fired)=>{
    setComplaints(p=>[c,...p]);
    const msg=fired?.length?`✅ ${c.id} created · ⚡ ${fired.length} rule${fired.length>1?'s':''} fired: ${fired.map(r=>r.name).join(', ')}`:`✅ Case ${c.id} created`;
    showToast(msg);setView('dashboard');
  };
  const updateCase=(id,ch)=>setComplaints(p=>p.map(c=>c.id===id?{...c,...ch}:c));
  const perms=ROLES_CFG[role].perms;
  const breachN=complaints.filter(c=>getSLA(c).s==='breach'&&c.status!=='Resolved'&&c.status!=='Closed').length;
  const auditTotal=complaints.flatMap(c=>c.auditTrail).length;

  const NAV=[
    {sec:'Operations',items:[
      {id:'dashboard',icon:'📋',label:'Case Dashboard',badge:breachN>0?breachN:null,bcls:'nb-red'},
      {id:'intake',icon:'✏️',label:'New Complaint'},
      {id:'classifier',icon:'🤖',label:'AI Classifier'},
    ]},
    {sec:'Compliance',items:[
      {id:'cfpb',icon:'📊',label:'CFPB Reports',locked:!perms['CFPB Export']},
      {id:'audit',icon:'🔍',label:'Audit Log',badge:auditTotal,bcls:'nb-gray',locked:!perms['Audit Log']},
      {id:'analytics',icon:'📈',label:'Analytics',locked:!perms['Analytics']},
    ]},
    {sec:'Automation',items:[
      {id:'workflow',icon:'⚙️',label:'Workflow Builder',badge:rules.filter(r=>r.enabled).length,bcls:'nb-amber',locked:!perms['Workflow Builder']},
    ]},
  ];
  const TITLES={dashboard:'Case Dashboard',intake:'New Complaint Intake',classifier:'AI Classification Engine',cfpb:'CFPB Regulatory Report',audit:'Immutable Audit Log',analytics:'Analytics Dashboard',workflow:'Workflow &amp; Routing Builder'};

  const jumpToCase=caseId=>{const c=complaints.find(x=>x.id===caseId);if(c){setSelected(c);setView('dashboard');}};

  return<div className="app">
    <div className="sb">
      <div className="sb-logo">
        <div className="logo-row"><div className="logo-badge">1FFC</div><div className="logo-name">ComplaintPortal</div></div>
        <div className="logo-sub">Complaint Management · v3.0</div>
      </div>
      <div className="sb-nav">
        {NAV.map(({sec,items})=><React.Fragment key={sec}>
          <div className="nav-sec">{sec}</div>
          {items.map(item=><button key={item.id} className={`nav-item ${view===item.id?'active':''} ${item.locked?'locked':''}`}
            onClick={()=>!item.locked&&setView(item.id)} title={item.locked?`Requires elevated role`:''}>
            <span className="nav-icon">{item.icon}</span>
            {item.label}
            {item.locked&&<span style={{marginLeft:'auto',fontSize:11}}>🔒</span>}
            {!item.locked&&item.badge!=null&&item.badge>0&&<span className={`nav-badge ${item.bcls||'nb-gray'}`}>{item.badge}</span>}
          </button>)}
        </React.Fragment>)}
      </div>
      <div className="sb-foot">
        <div className="user-pill">
          <div className="avatar">{role==='agent'?'BA':role==='compliance'?'CO':'SA'}</div>
          <div><div className="u-name">Ellen Hart</div><div className="u-role">{ROLES_CFG[role].label}</div></div>
        </div>
      </div>
    </div>

    <div className="main">
      <div className="topbar">
        <div className="topbar-title" dangerouslySetInnerHTML={{__html:TITLES[view]}}/>
        <div className="topbar-actions">
          <div style={{display:'flex',alignItems:'center',gap:5,padding:'4px 10px',background:'var(--emerald-bg)',borderRadius:20,fontSize:11,fontWeight:700,color:'var(--emerald-dk)'}}>
            <span style={{width:6,height:6,borderRadius:'50%',background:'var(--emerald)',display:'inline-block'}}/>AI Online
          </div>
          <div style={{display:'flex',alignItems:'center',gap:5,padding:'4px 10px',background:'var(--blue-tint)',borderRadius:20,fontSize:11,fontWeight:700,color:'var(--navy)'}}>
            ⚡ {rules.filter(r=>r.enabled).length} Rules Active
          </div>
          <RolePill role={role} onClick={()=>setShowRole(true)}/>
        </div>
      </div>
      <div className="content">
        {view==='dashboard' &&<DashboardScreen complaints={complaints} role={role} onSelect={setSelected} onNew={()=>setView('intake')}/>}
        {view==='intake'    &&<IntakeScreen complaints={complaints} rules={rules} onSubmit={addComplaint}/>}
        {view==='classifier'&&<ClassifierScreen/>}
        {view==='cfpb'      &&<CFPBScreen complaints={complaints} role={role}/>}
        {view==='audit'     &&<AuditScreen complaints={complaints} role={role} onSelectCase={jumpToCase}/>}
        {view==='analytics' &&<AnalyticsScreen complaints={complaints} role={role}/>}
        {view==='workflow'  &&<WorkflowScreen rules={rules} onUpdate={setRules} complaints={complaints} role={role} showToast={showToast}/>}
      </div>
    </div>

    {selected&&<CaseDrawer complaint={selected} role={role} onClose={()=>setSelected(null)}
      onUpdate={(id,ch)=>{updateCase(id,ch);setSelected(p=>({...p,...ch}));}} showToast={showToast}/>}
    {showRole&&<RoleModal role={role} onSelect={setRole} onClose={()=>setShowRole(false)}/>}
    <Toast msg={toast} onDone={()=>setToast(null)}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(React.StrictMode,null,React.createElement(App))
);
</script>
</body>
</html>
