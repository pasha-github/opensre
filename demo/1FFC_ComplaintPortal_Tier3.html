<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>1FFC Complaint Management Portal — v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
:root{
  --navy:#0F2044;--navy-l:#1e3a6e;--navy-dim:rgba(15,32,68,.07);
  --blue-tint:#E8F0FE;--blue-mid:#BFDBFE;
  --amber:#F59E0B;--amber-bg:#FEF3C7;--amber-dk:#92400E;
  --emerald:#10B981;--emerald-bg:#D1FAE5;--emerald-dk:#065F46;
  --red:#EF4444;--red-bg:#FEE2E2;--red-dk:#991B1B;
  --purple:#8B5CF6;--purple-bg:#EDE9FE;--purple-dk:#5B21B6;
  --sky:#3B82F6;--sky-bg:#DBEAFE;
  --g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g300:#D1D5DB;
  --g400:#9CA3AF;--g500:#6B7280;--g600:#4B5563;--g700:#374151;--g900:#111827;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--g50);color:var(--g900);font-size:14px}
.app{display:flex;height:100vh;overflow:hidden}
/* SIDEBAR */
.sb{width:232px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.logo-row{display:flex;align-items:center;gap:8px}
.logo-badge{background:var(--amber);color:var(--g900);font-size:11px;font-weight:800;padding:3px 7px;border-radius:5px}
.logo-name{font-size:14px;font-weight:800;color:white;letter-spacing:.04em}
.logo-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:4px;letter-spacing:.04em;text-transform:uppercase}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-sec{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.1em;text-transform:uppercase;padding:10px 10px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.6);border:none;background:none;width:100%;text-align:left;transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.08);color:white}
.nav-item.active{background:rgba(255,255,255,.14);color:white;font-weight:600}
.nav-item.locked{opacity:.3;cursor:not-allowed;pointer-events:none}
.nav-icon{font-size:14px;flex-shrink:0;width:18px;text-align:center}
.nav-badge{margin-left:auto;padding:2px 6px;border-radius:10px;font-size:10px;font-weight:700}
.nb-red{background:var(--red);color:white}
.nb-amber{background:var(--amber);color:var(--g900)}
.nb-gray{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8)}
.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.user-pill{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.15);color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.u-name{font-size:12px;font-weight:600;color:white}
.u-role{font-size:10px;color:rgba(255,255,255,.45);margin-top:1px}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:52px;background:white;border-bottom:1px solid var(--g200);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;z-index:10}
.topbar-title{font-size:15px;font-weight:700;color:var(--g900);flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:20px 24px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:'Inter',sans-serif;white-space:nowrap}
.btn-navy{background:var(--navy);color:white}.btn-navy:hover{background:var(--navy-l)}
.btn-sec{background:var(--g100);color:var(--g700);border:1px solid var(--g200)}.btn-sec:hover{background:var(--g200)}
.btn-green{background:var(--emerald);color:white}.btn-green:hover{background:#059669}
.btn-amber{background:var(--amber);color:white}
.btn-red{background:var(--red);color:white}
.btn-ghost{background:none;border:1.5px solid var(--g200);color:var(--g600)}.btn-ghost:hover{border-color:var(--navy);color:var(--navy)}
.btn-sm{padding:5px 11px;font-size:11.5px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* CARDS */
.card{background:white;border-radius:10px;border:1px solid var(--g200)}
.cp{padding:18px 20px}
/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:white;border:1px solid var(--g200);border-radius:10px;padding:16px 18px}
.kpi.al{border-left:4px solid var(--amber)}
.kpi.nl{border-left:4px solid var(--navy)}
.kpi.rl{border-left:4px solid var(--red)}
.kpi.el{border-left:4px solid var(--emerald)}
.kpi-label{font-size:10.5px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.05em}
.kpi-val{font-size:26px;font-weight:800;color:var(--g900);margin:4px 0 2px;line-height:1}
.kpi-sub{font-size:11px;color:var(--g500)}
/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.bo{background:var(--sky-bg);color:#1D4ED8}
.br{background:var(--amber-bg);color:var(--amber-dk)}
.bres{background:var(--emerald-bg);color:var(--emerald-dk)}
.bcl{background:var(--g100);color:var(--g600)}
.besc{background:var(--red-bg);color:var(--red-dk)}
.bcrit{background:var(--red-bg);color:var(--red-dk)}
.bhi{background:var(--amber-bg);color:var(--amber-dk)}
.bmed{background:var(--sky-bg);color:#1D4ED8}
.blo{background:var(--g100);color:var(--g600)}
.bRESPA{background:var(--purple-bg);color:var(--purple-dk)}
.bFCRA{background:#FCE7F3;color:#9D174D}
.bUDAAP{background:var(--amber-bg);color:var(--amber-dk)}
.bECOA{background:var(--emerald-bg);color:var(--emerald-dk)}
.bFDCPA{background:var(--sky-bg);color:#1D4ED8}
.bnone{background:var(--g100);color:var(--g500)}
/* TABLE */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;padding:9px 14px;border-bottom:1px solid var(--g200);background:var(--g50);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--g100);font-size:12.5px;color:var(--g700);vertical-align:middle}
.tbl tr:hover td{background:var(--blue-tint);cursor:pointer}
.tbl tr.nh:hover td{background:none;cursor:default}
.case-id{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500;color:var(--navy)}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--g500)}
/* SLA */
.sla{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500}
.sla-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sla-ok{color:var(--emerald)}.sla-ok .sla-dot{background:var(--emerald)}
.sla-warn{color:var(--amber)}.sla-warn .sla-dot{background:var(--amber);animation:pulse 1s infinite}
.sla-breach{color:var(--red)}.sla-breach .sla-dot{background:var(--red);animation:pulse .7s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
/* DRAWER */
.drawer-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;justify-content:flex-end}
.drawer{width:500px;background:white;height:100%;overflow-y:auto;box-shadow:-6px 0 32px rgba(0,0,0,.18);display:flex;flex-direction:column}
.dw-hdr{padding:18px 20px;display:flex;align-items:flex-start;gap:12px;background:var(--navy);flex-shrink:0}
.dw-info{flex:1;min-width:0}
.dw-id{font-family:'JetBrains Mono',monospace;font-size:12px;color:rgba(255,255,255,.6);margin-bottom:3px}
.dw-name{font-size:16px;font-weight:700;color:white;margin-bottom:2px}
.dw-sub{font-size:12px;color:rgba(255,255,255,.55)}
.dw-close{background:rgba(255,255,255,.12);border:none;color:white;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dw-body{padding:18px 20px;flex:1}
.dw-sec{margin-bottom:18px}
.dw-sec-title{font-size:11px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.di label{font-size:10.5px;font-weight:600;color:var(--g500);display:block;margin-bottom:2px}
.di span{font-size:13px;color:var(--g900)}
.narr{background:var(--g50);border:1px solid var(--g200);border-radius:8px;padding:12px;font-size:12.5px;color:var(--g700);line-height:1.6}
/* TIMELINE */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--g200)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{position:absolute;left:-19px;top:3px;width:10px;height:10px;border-radius:50%;background:white;border:2px solid var(--g300)}
.tl-dot.create{border-color:var(--navy);background:var(--navy)}
.tl-dot.classify{border-color:var(--purple);background:var(--purple)}
.tl-dot.status{border-color:var(--amber);background:var(--amber)}
.tl-dot.assign{border-color:var(--emerald);background:var(--emerald)}
.tl-dot.note{border-color:var(--g400);background:var(--g400)}
.tl-dot.rule{border-color:var(--sky);background:var(--sky)}
.tl-ts{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--g400);margin-bottom:2px}
.tl-action{font-size:12.5px;color:var(--g700);line-height:1.4}
.tl-actor{font-size:11px;font-weight:600;color:var(--g500);margin-top:2px}
/* FORM */
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:11.5px;font-weight:600;color:var(--g600)}
.fg.full{grid-column:1/-1}
input,select,textarea{padding:9px 11px;border:1.5px solid var(--g200);border-radius:7px;font-size:13px;font-family:'Inter',sans-serif;color:var(--g900);background:white;transition:border-color .15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-dim)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
.ferr{font-size:11px;color:var(--red);margin-top:2px}
/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:white;border-radius:14px;padding:24px;width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.22)}
.modal-title{font-size:17px;font-weight:800;color:var(--g900);margin-bottom:4px}
.modal-sub{font-size:12.5px;color:var(--g500);margin-bottom:20px}
.role-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.role-card{border:2px solid var(--g200);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;text-align:left;background:white}
.role-card:hover{border-color:var(--navy);background:var(--blue-tint)}
.role-card.sel{border-color:var(--navy);background:var(--blue-tint)}
.rc-icon{font-size:22px;margin-bottom:8px}
.rc-title{font-size:12.5px;font-weight:700;color:var(--g900);margin-bottom:3px}
.rc-desc{font-size:11px;color:var(--g500);margin-bottom:10px;line-height:1.4}
.perm{display:flex;align-items:center;gap:5px;font-size:10.5px;margin-bottom:3px}
/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:white;padding:11px 16px;border-radius:9px;font-size:12.5px;font-weight:500;z-index:999;box-shadow:0 6px 24px rgba(0,0,0,.2);animation:slideUp .2s ease;max-width:400px}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* ROLE PILL */
.role-pill{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;cursor:pointer;border:1.5px solid;transition:all .15s}
.role-pill:hover{opacity:.85}
/* TOGGLE */
.toggle{width:36px;height:20px;border-radius:10px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle-thumb{width:16px;height:16px;border-radius:50%;background:white;position:absolute;top:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
/* WORKFLOW BUILDER */
.wf-shell{display:grid;grid-template-columns:380px 1fr;gap:16px;margin-bottom:16px;align-items:start}
.rule-card{background:white;border:1.5px solid var(--g200);border-radius:9px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all .15s;display:flex;gap:10px;align-items:flex-start}
.rule-card:hover{border-color:var(--navy);box-shadow:0 2px 8px rgba(15,32,68,.08)}
.rule-card.active{border-color:var(--navy);background:var(--blue-tint);box-shadow:0 2px 8px rgba(15,32,68,.12)}
.rule-card.drag-over{border-color:var(--amber);border-style:dashed}
.rule-card.dragging{opacity:.4}
.drag-handle{color:var(--g300);font-size:16px;cursor:grab;flex-shrink:0;padding-top:2px;user-select:none}
.drag-handle:active{cursor:grabbing}
.rule-priority{width:22px;height:22px;border-radius:50%;background:var(--navy);color:white;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rule-body{flex:1;min-width:0}
.rule-name{font-size:13px;font-weight:700;color:var(--g900);margin-bottom:3px}
.rule-cond-summary{font-size:11.5px;color:var(--g600);margin-bottom:6px;line-height:1.4}
.rule-action-chips{display:flex;gap:4px;flex-wrap:wrap}
.action-chip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--blue-tint);color:var(--navy)}
.rule-controls{display:flex;align-items:center;gap:8px;flex-shrink:0}
/* RULE EDITOR */
.editor-panel{background:white;border-radius:10px;border:1.5px solid var(--g200);overflow:hidden}
.editor-hdr{padding:16px 20px;border-bottom:1px solid var(--g200);background:var(--navy);display:flex;align-items:center;gap:10px}
.editor-body{padding:20px}
.cond-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cond-row select{padding:7px 9px;font-size:12px;flex:1;min-width:100px}
.cond-row .operator{min-width:90px;flex:0 0 auto}
.cond-row input{padding:7px 9px;font-size:12px;flex:1;min-width:100px}
.remove-btn{background:none;border:none;color:var(--g400);cursor:pointer;font-size:16px;flex-shrink:0;padding:2px 4px;border-radius:4px}
.remove-btn:hover{color:var(--red);background:var(--red-bg)}
.action-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.action-row select{padding:7px 9px;font-size:12px;flex:1;min-width:120px}
.action-row input{padding:7px 9px;font-size:12px;flex:1;min-width:120px}
.logic-toggle{display:flex;gap:4px}
.lt-btn{padding:4px 12px;border-radius:6px;font-size:11px;font-weight:700;border:1.5px solid var(--g200);background:white;cursor:pointer;color:var(--g600);transition:all .15s}
.lt-btn.active{background:var(--navy);color:white;border-color:var(--navy)}
/* TESTER */
.tester{background:white;border:1.5px solid var(--g200);border-radius:10px;padding:20px}
.test-result-row{display:grid;grid-template-columns:180px 60px 1fr 1fr;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--g100);font-size:12.5px}
.test-result-row:last-child{border:none}
.test-result-hdr{background:var(--g50);font-size:10.5px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.04em;padding:8px 14px;display:grid;grid-template-columns:180px 60px 1fr 1fr;gap:12px;border-bottom:1px solid var(--g200);border-radius:8px 8px 0 0}
/* ANALYTICS */
.an-grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.an-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.chart-title{font-size:13px;font-weight:700;color:var(--g900);margin-bottom:14px}
.v-bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding:0 2px}
.v-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.v-val{font-size:10px;font-weight:700;color:var(--g600)}
.v-fill{width:100%;border-radius:3px 3px 0 0;min-height:4px}
.v-lbl{font-size:10px;color:var(--g500);text-align:center;line-height:1.2}
.h-bars{display:flex;flex-direction:column;gap:7px}
.h-row{display:flex;align-items:center;gap:8px}
.h-lbl{width:120px;font-size:11.5px;color:var(--g600);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-track{flex:1;height:22px;background:var(--g100);border-radius:4px;overflow:hidden}
.h-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;transition:width .6s ease}
.h-fill span{font-size:11px;font-weight:700;color:white}
.h-cnt{width:28px;font-size:11.5px;font-weight:600;color:var(--g700);text-align:right;flex-shrink:0}
/* SPARKLINE */
.spark{display:flex;align-items:flex-end;gap:3px;height:50px}
.spark-bar{flex:1;border-radius:2px 2px 0 0;min-height:3px;transition:height .4s ease}
/* HEATMAP */
.heatmap-tbl{width:100%;border-collapse:collapse;font-size:12px}
.heatmap-tbl th{text-align:center;font-size:10px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--g200);background:var(--g50)}
.heatmap-tbl th:first-child{text-align:left}
.heatmap-tbl td{padding:9px 10px;border-bottom:1px solid var(--g100);text-align:center;font-weight:600}
.heatmap-tbl td:first-child{text-align:left;font-weight:600;color:var(--g900);font-size:12px}
/* GAUGE */
.gauge-wrap{display:flex;flex-direction:column;align-items:center}
.gauge-ring{position:relative;width:90px;height:90px;margin-bottom:8px}
.gauge-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-pct{font-size:20px;font-weight:800;color:var(--g900)}
.gauge-lbl{font-size:10px;color:var(--g500)}
/* MISC */
.divider{height:1px;background:var(--g200);margin:14px 0}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-size:14.5px;font-weight:700;color:var(--g900)}
.pill-tabs{display:flex;gap:4px;background:var(--g100);padding:3px;border-radius:8px}
.ptab{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--g600);transition:all .15s;font-family:'Inter',sans-serif}
.ptab.active{background:white;color:var(--g900);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.access-wall{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:12px;color:var(--g500)}
.aw-icon{font-size:48px}
.aw-title{font-size:16px;font-weight:700;color:var(--g700)}
.aw-desc{font-size:13px;max-width:320px;text-align:center;line-height:1.5}
.info-bar{padding:11px 14px;background:var(--blue-tint);border-radius:9px;border:1px solid var(--blue-mid);font-size:12px;color:var(--navy);line-height:1.6;margin-top:14px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--g300);border-radius:3px}
</style>
</head>
<body>
<div id="root" style="display:flex;height:100vh;align-items:center;justify-content:center;font-family:Inter,sans-serif;color:#6B7280;font-size:13px">Initializing…</div>
